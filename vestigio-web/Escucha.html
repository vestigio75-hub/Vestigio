<script>

class Component extends DCLogic {
  setScroller = (el) => { this.scroller = el; };
  setKin = (el) => { this.kin = el; this.vetas = null; };
  setP1 = (el) => { this.p1 = el; };
  setP2 = (el) => { this.p2 = el; };
  setImg = (el) => { this.img = el; };
  setVig = (el) => { this.vig = el; };
  setDark = (el) => { this.dark = el; };
  setTitle = (el) => { this.title = el; };
  setHead = (el) => { this.head = el; };
  setFoot = (el) => { this.foot = el; };
  setHint = (el) => { this.hint = el; };

  // la animación se pinta directo en cada cuadro (sin re-render), para que sea lo más fluida posible
  paint(u, vh) {
    const clamp = (v) => Math.min(1, Math.max(0, v));
    const ease = (t) => 0.5 - 0.5 * Math.cos(Math.PI * t);
    const p = clamp(u / (3.2 * vh));
    const a = ease(clamp(p / 0.3));               // 1) "Durante" llega desde lejos
    const b = ease(clamp((p - 0.38) / 0.62));     // 2) seguimos entrando y todo se oscurece
    const fly = ease(clamp((p - 0.38) / 0.3));    //    el título pasa de largo
    if (this.img) this.img.style.transform = 'translateZ(0) scale(' + (1 + 0.25 * a + 1.9 * b).toFixed(4) + ')';
    if (this.vig) this.vig.style.opacity = (0.4 + 0.6 * Math.max(a, b)).toFixed(3);
    if (this.dark) this.dark.style.opacity = Math.pow(b, 1.4).toFixed(3);
    if (this.title) {
      // un solo movimiento continuo: el título crece sin detenerse y pasa de largo
      const q = clamp(p / 0.68);
      const sc = 0.35 * Math.exp(Math.log(3.6 / 0.35) * Math.pow(q, 1.2));
      const fin = ease(clamp(p / 0.22)), fout = ease(clamp((p - 0.42) / 0.26));
      this.title.style.transform = 'translate3d(0, -50%, 0) scale(' + sc.toFixed(4) + ')';
      this.title.style.opacity = (fin * (1 - fout)).toFixed(3);
    }
    const ui = (1 - clamp((p - 0.6) / 0.3)).toFixed(3);
    if (this.head) this.head.style.opacity = ui;
    if (this.foot) this.foot.style.opacity = ui;
    if (this.hint) this.hint.style.opacity = (1 - clamp(u / 250)).toFixed(3);
  }

  // el título se dibuja una sola vez como imagen (canvas) en alta resolución:
  // así el navegador solo la escala en cada cuadro y las letras no se traban ni "saltan"
  makeTitleCanvas() {
    const h = this.title;
    if (!h) return;
    try {
      const cs = getComputedStyle(h);
      const fs = parseFloat(cs.fontSize) || 160;
      const ls = parseFloat(cs.letterSpacing) || 0;
      const text = (h.getAttribute('aria-label') || h.textContent || '').trim();
      const font = cs.fontWeight + ' ' + fs + 'px ' + cs.fontFamily;
      const c = this.titleCanvas || document.createElement('canvas');
      let ctx = c.getContext('2d');
      const native = 'letterSpacing' in ctx;
      const measure = () => {
        ctx.font = font;
        if (native) { ctx.letterSpacing = ls + 'px'; return ctx.measureText(text).width; }
        let w = 0; for (const ch of text) w += ctx.measureText(ch).width + ls; return w - ls;
      };
      const w = measure();
      const pad = Math.ceil(fs * 0.25 + 40);
      const cssW = Math.ceil(w + pad * 2), cssH = Math.ceil(fs * 1.3 + pad * 2);
      let R = (window.devicePixelRatio || 1) * 2;
      R = Math.min(R, 8000 / cssW, 8000 / cssH);
      c.width = Math.round(cssW * R); c.height = Math.round(cssH * R);
      ctx = c.getContext('2d');
      ctx.setTransform(R, 0, 0, R, 0, 0);
      measure();
      const m = ctx.measureText(text);
      const asc = m.fontBoundingBoxAscent || fs * 0.9, desc = m.fontBoundingBoxDescent || fs * 0.25;
      const y = cssH / 2 + (asc - desc) / 2;
      ctx.fillStyle = cs.color && cs.color !== 'rgba(0, 0, 0, 0)' && !this.titleCanvas ? cs.color : '#FFFFFF';
      ctx.shadowColor = 'rgba(0,0,0,0.35)';
      ctx.shadowBlur = 30 * R; ctx.shadowOffsetY = 6 * R;
      if (native) { ctx.textAlign = 'center'; ctx.fillText(text, cssW / 2 + ls / 2, y); }
      else {
        let x = (cssW - w) / 2;
        for (const ch of text) { ctx.fillText(ch, x, y); x += ctx.measureText(ch).width + ls; }
      }
      c.setAttribute('aria-hidden', 'true');
      c.style.cssText = 'position:absolute;left:50%;top:50%;width:' + cssW + 'px;height:' + cssH + 'px;transform:translate(-50%,-50%);pointer-events:none';
      if (!this.titleCanvas) { h.setAttribute('aria-label', text); h.appendChild(c); this.titleCanvas = c; }
      h.style.color = 'transparent'; h.style.textShadow = 'none';
    } catch (e) {}
  }

  componentDidMount() {
    this.onTitleResize = () => { clearTimeout(this.trT); this.trT = setTimeout(() => this.makeTitleCanvas(), 150); };
    window.addEventListener('resize', this.onTitleResize);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => this.makeTitleCanvas()); else this.makeTitleCanvas();
    this.trT2 = setTimeout(() => this.makeTitleCanvas(), 1500);
    // la animación arranca siempre desde el principio al entrar a la sección
    this.reset = () => {
      if (this.scroller) this.scroller.scrollTop = 0;
      this.su = 0; this.lastU = null; this.lastProg = null; this.goldP = 0;
      this.setState({ u: 0, r1: false, r2: false, seen: null });
    };
    try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) {}
    // algunos navegadores (p. ej. Chrome/Edge en Windows) restauran el scroll después de montar:
    // durante el primer segundo se fuerza volver arriba
    this.forceTopUntil = performance.now() + 1000;
    this.reset();
    this.onVis = () => { if (document.hidden) this.reset(); else { this.reset(); this.forceTopUntil = performance.now() + 600; } };
    document.addEventListener('visibilitychange', this.onVis);
    window.addEventListener('pageshow', this.reset);
    if (window.IntersectionObserver && this.scroller) {
      this.io = new IntersectionObserver((entries) => {
        entries.forEach((e) => { if (!e.isIntersecting) this.reset(); });
      });
      this.io.observe(this.scroller);
    }
    const tick = () => {
      const el = this.scroller;
      if (el) {
        // si la sección estuvo oculta (otra sección / otra pestaña) y vuelve a verse, empieza de cero
        const visible = el.clientHeight > 0 && el.getClientRects().length > 0;
        if (!visible) this.wasHidden = true;
        else if (this.wasHidden) { this.wasHidden = false; this.reset(); this.forceTopUntil = performance.now() + 600; }
        if (performance.now() < this.forceTopUntil && el.scrollTop !== 0) { el.scrollTop = 0; this.su = 0; }
        const target = el.scrollTop;
        this.su = this.su == null ? target : this.su + (target - this.su) * 0.1;
        if (Math.abs(target - this.su) < 0.05) this.su = target;
        const vh = el.clientHeight || 900;
        if (this.su !== this.lastU || vh !== this.lastVh) {
          this.paint(this.su, vh);
          this.lastU = this.su; this.lastVh = vh;
        }
        const s = this.state || {};
        const seen = (n) => n && n.getBoundingClientRect().top < vh * 0.85;
        if ((!s.r1 && seen(this.p1)) || (!s.r2 && seen(this.p2))) {
          this.setState({ r1: s.r1 || !!seen(this.p1), r2: s.r2 || !!seen(this.p2) });
        }
        // el oro va "pegando" las grietas a medida que bajas por los productos
        if (this.kin) {
          if (!this.vetas) this.vetas = Array.from(this.kin.querySelectorAll('.oro-veta')).map((e) => ({ el: e, d: parseFloat(e.getAttribute('data-delay')) || 0 }));
          const kr = this.kin.getBoundingClientRect();
          const target = Math.min(1, Math.max(0, (vh * 0.9 - kr.top) / Math.max(1, kr.height - vh * 0.1))); // llega a 1 al final de la página // primero se ve roto, luego el oro rellena
          // el oro avanza despacio, como líquido, siguiendo al scroll con retraso
          this.goldP = this.goldP == null ? 0 : this.goldP + (target - this.goldP) * 0.018;
          if (Math.abs(target - this.goldP) < 0.0005) this.goldP = target;
          const prog = this.goldP;
          if (prog !== this.lastProg) {
            this.lastProg = prog;
            this.vetas.forEach((v) => {
              const k = Math.min(1, Math.max(0, (prog - v.d) / 0.5)); // todas terminan cuando prog = 1
              v.el.style.strokeDashoffset = (1 - k).toFixed(4);
            });
          }
        }
      }
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }

  componentWillUnmount() {
    window.removeEventListener('resize', this.onTitleResize);
    clearTimeout(this.trT); clearTimeout(this.trT2);
    document.removeEventListener('visibilitychange', this.onVis);
    window.removeEventListener('pageshow', this.reset);
    if (this.io) this.io.disconnect();
    cancelAnimationFrame(this.raf);
  }

  renderVals() {
    const st = this.state || {};
    return {
      setScroller: this.setScroller, setKin: this.setKin, setP1: this.setP1, setP2: this.setP2,
      setImg: this.setImg, setVig: this.setVig, setDark: this.setDark, setTitle: this.setTitle,
      setHead: this.setHead, setFoot: this.setFoot, setHint: this.setHint,
      r1: st.r1 ? { op: 1, y: 0 } : { op: 0, y: 60 },
      r2: st.r2 ? { op: 1, y: 0 } : { op: 0, y: 60 },
    };
  }
}

DCBoot(Component, {});
</script>
