    this.onVis = () => { if (document.hidden) this.reset(); else { this.reset(); this.forceTopUntil = performance.now() + 600; } };
    document.addEventListener('visibilitychange', this.onVis);
    window.addEventListener('pageshow', this.reset);
    if (window.IntersectionObserver && this.scroller) {
      this.io = new IntersectionObserver((entries) => {
        entries.forEach((e) => { if (!e.isIntersecting) this.reset(); });
      });
      this.io.observe(this.scroller);
    }
    const tick = () => {
      const el = this.scroller;
      if (el) {
        // si la sección estuvo oculta (otra sección / otra pestaña) y vuelve a verse, empieza de cero
        const visible = el.clientHeight > 0 && el.getClientRects().length > 0;
        if (!visible) this.wasHidden = true;
        else if (this.wasHidden) { this.wasHidden = false; this.reset(); this.forceTopUntil = performance.now() + 600; }
        if (performance.now() < this.forceTopUntil && el.scrollTop !== 0) { el.scrollTop = 0; this.su = 0; }
        const vw = el.clientWidth || 1440;
        const vh = el.clientHeight || 900;
        // el mapa sigue al scroll con una pequeña inercia, para que se sienta fluido
        const target = Math.max(0, el.scrollTop - (this.track ? this.track.offsetTop : 0)); // el mapa empieza después de "¿Qué es Vestigio?"
        this.su = this.su == null ? target : this.su + (target - this.su) * 0.16;
        if (Math.abs(target - this.su) < 0.3) this.su = target;
        const u = this.su;
        this.liveU = u;
        this.paintVes(vw, vh);
        const s = this.state || {};
        if (s.vw !== vw || s.vh !== vh) {
          this.setState({ u: u, vw: vw, vh: vh });
          this.lastMapU = u;
        } else if (this.lastMapU == null || Math.abs(this.lastMapU - u) > 0.05) {
          // el mapa se pinta directo en cada cuadro (sin re-render): mucho más fluido, sobre todo en celular
          this.lastMapU = u;
          this.paintMap(this.renderVals());
        }
      }
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }

  paintMap(v) {
    if (!this.track) return;
    let gi = 0;
    this.track.querySelectorAll('[data-m]').forEach((el) => {
      const k = el.getAttribute('data-m'), t = k[0], i = +k.slice(1);
      const st = el.style;
      if (t === 'L') st.transform = 'translateY(' + v['y' + (i + 1)] + 'px)';
      else if (t === 'B') st.opacity = v['u' + (i + 1)].op;
      else if (t === 'E') { st.transform = 'translateY(' + v['y' + (i + 1)] + 'px)'; st.visibility = v['u' + (i + 1)].vis; }
      else if (t === 'G') { const g = v.gaps[gi++]; if (g) { st.top = g.top + 'px'; st.height = g.h + 'px'; st.opacity = g.op; st.visibility = g.vis; } }
      else if (t === 'H') st.opacity = v.hint;
      else {
        const l = v['l' + (i + 1)];
        if (t === 'C') { st.top = l.ctop + 'px'; st.height = l.ch + 'px'; st.visibility = l.vis; }
        else if (t === 'A') { st.width = l.w + 'px'; st.transform = 'translate(-50%, ' + l.sy + 'px) rotate(' + l.rot + 'deg)'; st.pointerEvents = l.pe; }
        else if (t === 'S') st.fontSize = l.fs + 'px';
        else if (t === 'X') { st.top = l.tt + 'px'; st.opacity = l.op; }
        else if (t === 'K') st.pointerEvents = l.pe;
      }
    });
  }

  // ¿Qué es Vestigio?: huellas que ruedan y van revelando el texto (se pinta directo, sin re-render)
  paintVes(vw, vh) {
    if (!this.ves) return;
    const clamp = (v) => Math.min(1, Math.max(0, v));
    const ease = (t) => 0.5 - 0.5 * Math.cos(Math.PI * t);
    const r = this.ves.getBoundingClientRect();
    const target = clamp(-r.top / Math.max(1, r.height - vh));
    // inercia suave para que las huellas rueden fluido
    this.vp = this.vp == null ? target : this.vp + (target - this.vp) * 0.1;
    if (Math.abs(target - this.vp) < 0.0003) this.vp = target;
    const p = this.vp;
    // huellas que ruedan solas mientras la persona no ha empezado a deslizar
    const idleOp = 1 - clamp(p / 0.06);
    const now = performance.now() / 1000;
    const I = [[5.5, 0.0, 0.14, 0.30, -1], [4.2, 0.35, 0.06, 0.80, 1], [6.5, 0.6, 0.09, 0.62, -1], [4.8, 0.15, 0.05, 0.16, 1],
               [5.0, 0.8, 0.07, 0.48, 1], [3.8, 0.5, 0.04, 0.90, -1], [6.0, 0.25, 0.11, 0.12, -1], [4.5, 0.7, 0.05, 0.70, 1], [5.8, 0.45, 0.08, 0.40, -1]];
    I.forEach((h, i) => {
      const el = this['i' + i];
      if (!el) return;
      const size = Math.max(50, h[2] * Math.min(vw, vh * 1.3));
      const t = ((now / h[0]) + h[1]) % 1;
      const from = h[4] > 0 ? -size * 1.2 : vw + size * 0.2;
      const to = h[4] > 0 ? vw + size * 0.2 : -size * 1.2;
      const x = from + (to - from) * t;
      const rot = ((x - from) / (size / 2)) * (180 / Math.PI) * 0.5;
      el.style.width = size.toFixed(0) + 'px';
      el.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + (h[3] * vh - size * 0.64).toFixed(1) + 'px,0) rotate(' + rot.toFixed(1) + 'deg)';
      el.style.opacity = (0.9 * idleOp).toFixed(3);
    });
    if (p === this.lastVes && vw === this.lastVesW) return;
    this.lastVes = p; this.lastVesW = vw;
    // [inicio, fin, tamaño (fracción del ancho), altura (fracción de la pantalla), dirección 1 = izq→der, -1 = der→izq]
    const H = [
      [0.00, 0.20, 0.20, 0.30, -1],
      [0.06, 0.24, 0.07, 0.86, 1],
      [0.12, 0.30, 0.05, 0.14, -1],
      [0.20, 0.40, 0.13, 0.76, 1],
      [0.26, 0.44, 0.06, 0.22, -1],
      [0.32, 0.50, 0.04, 0.92, -1],
      [0.38, 0.58, 0.11, 0.66, 1],
      [0.44, 0.62, 0.05, 0.10, 1],
      [0.50, 0.70, 0.15, 0.36, -1],
      [0.56, 0.74, 0.06, 0.84, 1],
      [0.62, 0.80, 0.05, 0.18, -1],
      [0.68, 0.88, 0.10, 0.70, -1],
      [0.74, 0.92, 0.04, 0.26, 1],
      [0.80, 0.98, 0.08, 0.90, 1],
      [0.03, 0.19, 0.05, 0.62, 1],
      [0.16, 0.34, 0.08, 0.08, 1],
      [0.29, 0.47, 0.06, 0.48, -1],
      [0.41, 0.57, 0.04, 0.94, 1],
      [0.53, 0.71, 0.09, 0.52, -1],
      [0.65, 0.83, 0.05, 0.06, -1],
    ];
    H.forEach((h, i) => {
      const el = this['h' + i];
      if (!el) return;
      const size = Math.max(50, h[2] * Math.min(vw, vh * 1.3));
      const t = clamp((p - h[0]) / (h[1] - h[0]));
      const from = h[4] > 0 ? -size * 1.2 : vw + size * 0.2;
      const to = h[4] > 0 ? vw + size * 0.2 : -size * 1.2;
      const x = from + (to - from) * t;   // velocidad constante: rueda parejo
      const rot = ((x - from) / (size / 2)) * (180 / Math.PI) * 0.5;
      const y = h[3] * vh - size * 0.64;
      el.style.width = size.toFixed(0) + 'px';
      el.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) rotate(' + rot.toFixed(1) + 'deg)';
      el.style.opacity = (t > 0 && t < 1 ? 0.9 : 0).toString();
    });
    // primero el título y después, en orden, cada frase
    const T = [[0.02, 0.12], [0.18, 0.30], [0.34, 0.46], [0.50, 0.62], [0.66, 0.78]];
    T.forEach((w, i) => {
      const el = this['t' + i];
      if (!el) return;
      const k = ease(clamp((p - w[0]) / (w[1] - w[0])));
      el.style.opacity = k.toFixed(3);
      if (i === 0) el.style.transform = 'translateY(' + (30 * (1 - k)).toFixed(1) + 'px)';
    });
    if (this.vhint) this.vhint.style.opacity = (1 - clamp((p - 0.74) / 0.06)).toFixed(3);
    if (this.vend) this.vend.style.opacity = clamp((p - 0.82) / 0.06).toFixed(3); // al terminar el texto: invita a seguir al mapa
  }

  componentWillUnmount() {
    document.removeEventListener('visibilitychange', this.onVis);
    window.removeEventListener('pageshow', this.reset);
    if (this.io) this.io.disconnect();
    cancelAnimationFrame(this.raf);
  }

  // hojas y tierra que caen en cada abertura (fijas, para que no cambien en cada render)
  particles(seed) {
    let n = seed * 9301 + 49297;
    const rnd = () => { n = (n * 9301 + 49297) % 233280; return n / 233280; };
    const greens = ['#5c8a2e', '#79a83f', '#4b7526', '#8db54a'];
    const browns = ['#5a4330', '#3b3129', '#7a5c3a'];
    const out = [];
    for (let i = 0; i < 26; i++) {
      const leaf = rnd() < 0.6;
      const dur = leaf ? 3.5 + rnd() * 3 : 1.6 + rnd() * 1.6;
      const delay = -rnd() * dur;
      if (leaf) {
        out.push({
          x: (2 + rnd() * 96).toFixed(1), w: (8 + rnd() * 7).toFixed(0), h: (5 + rnd() * 3).toFixed(0),
          c: greens[Math.floor(rnd() * greens.length)], r: '0 100% 0 100%',
          anim: (rnd() < 0.5 ? 'caer1 ' : 'caer2 ') + dur.toFixed(2) + 's linear ' + delay.toFixed(2) + 's infinite',
        });
      } else {
        const s = (2 + rnd() * 3).toFixed(1);
        out.push({
          x: (2 + rnd() * 96).toFixed(1), w: s, h: s,
          c: browns[Math.floor(rnd() * browns.length)], r: '50%',
          anim: 'tierra ' + dur.toFixed(2) + 's ease-in ' + delay.toFixed(2) + 's infinite',
        });
      }
    }
    return out;
  }

  renderVals() {
    const st = this.state || {};
    const vw = st.vw || 1440;
    const vh = st.vh || 900;
    const u = this.liveU != null ? this.liveU : (st.u || 0);
    const mob = vw < 700; // celular
    const clamp = (v) => Math.min(1, Math.max(0, v));
    const ease = (t) => t * t * (3 - 2 * t);

    // el mapa en relieve ocupa todo el ancho (imagen de 1512 x 1824)
    const MW = mob ? vw : Math.min(vw, Math.max(720, vh * 1.25)); // ancho del mapa: igual proporción en pantallas anchas
    const k = MW / 1512;
    const mapH = 1824 * k;
    // altura de cada grieta en la imagen
    const yc = [525, 955, 1335].map((y) => y * k);
    // ancho de la abertura donde caen hojas (en % del ancho)
    const spans = [[13, 75], [11, 95], [27, 77]];
    const G = Math.max(260, (this.props.apertura ?? 0.62) * vh); // cuánto se abre
    const O = 0.85 * vh; // cuánto scroll dura la apertura
    const PAD = mob ? 74 : (vw < 760 ? 150 : 130); // alto del menú superior + espacio antes del mapa

    const T = [];
    for (let i = 0; i < 3; i++) {
      let t = yc[i] + PAD + i * (G / 2 + O) - vh / 2;
      t = i === 0 ? Math.max(t, 80) : Math.max(t, T[i - 1] + O + 80);
      T.push(t);
    }
    const tt = T.map((t) => clamp((u - t) / O));
    const g = tt.map(ease);

    // cuánto sube la cámara al abrirse cada grieta: nunca tanto que la tierra de arriba quede debajo del menú
    const shift = [];
    for (let i = 0; i < 3; i++) {
      let camAt = T[i] - PAD;
      for (let j = 0; j < i; j++) camAt += -O + shift[j];
      const startTop = yc[i] + G * i - camAt;
      shift.push(Math.min(G / 2, Math.max(0, startTop - (PAD + 10))));
    }
    let cam = u - PAD; // el mapa empieza debajo del menú
    for (let i = 0; i < 3; i++) cam += -O * tt[i] + shift[i] * g[i];

    const off = [0, G * g[0], G * (g[0] + g[1]), G * (g[0] + g[1] + g[2])];
    const y = off.map((o) => (o - cam).toFixed(1));

    // tierra colgando bajo cada pedazo de arriba: crece a medida que se abre
    // la tierra está completa desde el inicio, escondida detrás del pedazo de abajo:
    // al separarse, sale desde la ruptura
    const under = g.map((v) => ({ vis: v > 0.001 ? 'visible' : 'hidden', op: clamp(v / 0.2).toFixed(3) }));

    if (!this.parts) this.parts = [this.particles(3), this.particles(11), this.particles(29)];
    const gaps = [0, 1, 2].map((i) => {
      const op = clamp((g[i] - 0.15) / 0.4);
      return {
        left: spans[i][0], w: spans[i][1] - spans[i][0],
        top: (yc[i] + off[i] - cam).toFixed(1),
        h: Math.max(1, G * g[i]).toFixed(1),
        op: op.toFixed(3), vis: op > 0.01 ? 'visible' : 'hidden',
        parts: this.parts[i],
      };
    });

    const btn = [0, 1, 2].map((i) => {
      const yy = yc[i] + off[i] + G * 0.8 * g[i] - cam;
      const op = clamp((g[i] - 0.3) / 0.6);
      return {
        y: yy.toFixed(1),
        s: (0.25 + 0.75 * ease(clamp(g[i] / 0.9))).toFixed(3),
        op: op.toFixed(3),
        vis: op > 0.02 ? 'visible' : 'hidden',
        pe: op > 0.6 ? 'auto' : 'none',
      };
    });

    // imagen de fondo + espacio para el contexto de cada sección, con la misma animación de los botones
    // letreros de madera que caen desde la tierra colgante al abrirse cada grieta
    const bounce = (t) => {
      const n1 = 7.5625, d1 = 2.75;
      if (t < 1 / d1) return n1 * t * t;
      if (t < 2 / d1) { t -= 1.5 / d1; return n1 * t * t + 0.75; }
      if (t < 2.5 / d1) { t -= 2.25 / d1; return n1 * t * t + 0.9375; }
      t -= 2.625 / d1; return n1 * t * t + 0.984375;
    };
    // el letrero cuelga de lianas largas que salen de la ruptura; cae apenas empieza a abrirse el mapa
    const LR = 2438 / 900;                 // alto/ancho de la imagen (lianas + tablero)
    const BOARD_TOP = 0.752;               // dónde empieza la madera dentro de la imagen
    const lw = mob ? Math.max(104, Math.min(124, vw * 0.3)) : Math.max(150, Math.min(230, MW * 0.18, (G * 0.66 - 160) / (LR * (1 - BOARD_TOP))));
    const lh = lw * LR;
    const lets = [0, 1, 2].map((i) => {
      const gapTop = yc[i] + off[i] - cam;
      const f = clamp(g[i] / 0.55);       // empieza con la primera grieta
      const rest = G * 0.3 - lh * BOARD_TOP; // lianas largas: la madera cuelga a un tercio del hueco // la madera queda arriba en el hueco, las lianas suben hasta la tierra
      const sy = rest - (1 - bounce(f)) * lh * 0.7;
      const rot = 6 * Math.pow(1 - f, 1.2) * Math.sin(f * Math.PI * 4);
      const op = clamp((f - 0.7) / 0.3);
      return {
        ctop: gapTop.toFixed(1), ch: (G * 2).toFixed(1), // solo recorta arriba: las lianas salen de debajo de la tierra colgante
        w: lw.toFixed(0), fs: (lw * 0.14).toFixed(0),
        sy: sy.toFixed(1), rot: rot.toFixed(2),
        tt: (rest + lh + 6).toFixed(1), op: op.toFixed(3),
        vis: g[i] > 0.001 ? 'visible' : 'hidden', pe: f > 0.85 ? 'auto' : 'none',
      };
    });

    const secs = [0, 1, 2].map((i) => {
      const op = clamp((g[i] - 0.3) / 0.6);
      const gapTop = yc[i] + off[i] - cam;
      return {
        left: spans[i][0], w: spans[i][1] - spans[i][0],
        top: (gapTop + (G * g[i]) / 2 - G * 0.5).toFixed(1), h: G.toFixed(1),
        ty: (gapTop + G * 0.52 * g[i]).toFixed(1),
        s: (0.25 + 0.75 * ease(clamp(g[i] / 0.9))).toFixed(3),
        op: op.toFixed(3), iop: (op * 0.4).toFixed(3),
        vis: op > 0.02 ? 'visible' : 'hidden',
      };
    });

    const end = Math.max(mapH + PAD + 1.5 * G + 3 * O - vh + 60, T[2] + O + 120);

    return {
      setScroller: this.setScroller,
      setVes: this.setVes, setTrack: this.setTrack, setVhint: this.setVhint, setVend: this.setVend, setI4: this.setI4, setI5: this.setI5, setI6: this.setI6, setI7: this.setI7, setI8: this.setI8, setH14: this.setH14, setH15: this.setH15, setH16: this.setH16, setH17: this.setH17, setH18: this.setH18, setH19: this.setH19, setI0: this.setI0, setI1: this.setI1, setI2: this.setI2, setI3: this.setI3, setH7: this.setH7, setH8: this.setH8, setH9: this.setH9, setH10: this.setH10, setH11: this.setH11, setH12: this.setH12, setH13: this.setH13, setH0: this.setH0, setH1: this.setH1, setH2: this.setH2, setH3: this.setH3, setH4: this.setH4, setH5: this.setH5, setH6: this.setH6, setT0: this.setT0, setT1: this.setT1, setT2: this.setT2, setT3: this.setT3, setT4: this.setT4,
      goTop: this.goTop,
      bg: this.props.bg ?? '#D9C7B1',
      trackH: Math.ceil(end + vh), mw: MW.toFixed(0),
      y1: y[0], y2: y[1], y3: y[2], y4: y[3],
      u1: under[0], u2: under[1], u3: under[2],
      gaps: gaps,
      b1: btn[0], b2: btn[1], b3: btn[2],
      s1: secs[0], s2: secs[1], s3: secs[2],
      l1: lets[0], l2: lets[1], l3: lets[2],
      hint: (1 - clamp(u / 250)).toFixed(3),
    };
  }
}

DCBoot(Component, {"bg": "#D9C7B1", "apertura": 0.62});
</script>
