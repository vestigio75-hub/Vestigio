<style>

.rs-time{font:500 13px Inter,sans-serif;color:#6B564C;font-variant-numeric:tabular-nums;min-width:44px}

<span id="rs-cur" class="rs-time">00:00</span>
<input id="rs-seek" class="rs-seek" type="range" min="0" max="2226" step="1" value="0" aria-label="Posición del reportaje">

<script>

class Component extends DCLogic {
  setRoot = (el) => { this.root = el; };

  // ===== ondas del reportaje sonoro: tinta de colores superpuesta, movimiento continuo =====
  makeWaves(cv) {
    const W8 = { W: 0, H: 0, dpr: 1, sm: null, fps: 20, nb: 4, frames: 0 };
    const INK = [
      { c: 'rgba(142,163,238,0.85)', o: -0.35 }, // azul
      { c: 'rgba(168,196,80,0.85)', o: 0.2 },    // verde
      { c: 'rgba(222,206,98,0.9)', o: 0.55 },    // amarillo
      { c: 'rgba(107,86,76,0.5)', o: -0.1 },     // café
    ];
    const ROWS = [
      { y: 0.2, a: 0.13, m: [2, 3, 0, 1] },
      { y: 0.5, a: 0.24, m: [0, 1, 2, 3] },
      { y: 0.8, a: 0.13, m: [1, 0, 3, 2] },
    ];
    W8.load = () => fetch('assets/962c9a80cd446981c12a9bf5a058bdbc.json').then((r) => r.json()).then((j) => {
      const bin = atob(j.data), n = bin.length, nb = j.bands, fr = Math.floor(n / nb);
      // suavizado gaussiano por banda (≈0,35 s) para que las ondas respiren sin temblar
      const sig = 7, R = sig * 3, ker = [];
      let ks = 0; for (let d = -R; d <= R; d++) { const w = Math.exp(-(d * d) / (2 * sig * sig)); ker.push(w); ks += w; }
      const sm = [];
      for (let k = 0; k < nb; k++) {
        const raw = new Float32Array(fr); for (let i = 0; i < fr; i++) raw[i] = bin.charCodeAt(i * nb + k) / 255;
        const out = new Float32Array(fr);
        for (let i = 0; i < fr; i++) { let a = 0; for (let d = -R; d <= R; d++) { const q = Math.min(fr - 1, Math.max(0, i + d)); a += raw[q] * ker[d + R]; } out[i] = a / ks; }
        sm.push(out);
      }
      W8.sm = sm; W8.fps = j.fps; W8.nb = nb; W8.frames = fr;
    });
    const val = (k, t) => {
      if (!W8.sm || t < 0) return 0;
      const f = t * W8.fps, i = Math.floor(f), a = f - i, s = W8.sm[k];
      if (i >= W8.frames - 1) return 0;
      return s[i] * (1 - a) + s[i + 1] * a;
    };
    W8.size = () => {
      const r = cv.getBoundingClientRect(); W8.dpr = Math.min(2, window.devicePixelRatio || 1);
      W8.W = Math.max(1, r.width); W8.H = Math.max(1, r.height);
      cv.width = Math.round(W8.W * W8.dpr); cv.height = Math.round(W8.H * W8.dpr);
    };
    W8.draw = (T, opts) => {
      opts = opts || {};
      if (!W8.W) W8.size();
      const W = W8.W, H = W8.H, ctx = cv.getContext('2d'); if (!ctx) return;
      ctx.setTransform(W8.dpr, 0, 0, W8.dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      const SPAN = Math.max(6, Math.min(14, W / 85));
      const start = T - SPAN / 2, N = Math.ceil(W / 7) + 2, dt = SPAN / (N - 2);
      const i0 = Math.floor(start / dt) - 1; // la rejilla va pegada al tiempo: la forma se desliza entera, no tiembla
      ctx.globalCompositeOperation = 'multiply';
      ROWS.forEach((row) => {
        const y0 = row.y * H, A = row.a * H * 1.2;
        INK.forEach((ink, li) => {
          const k = row.m[li], pts = [];
          for (let i = 0; i <= N + 1; i++) {
            const t = (i0 + i) * dt, x = (t - start) / SPAN * W;
            const v = Math.pow(val(k, t + ink.o), 1.3);
            pts.push([x, Math.max(0.5, v * A * (0.8 + 0.2 * Math.sin(t * 0.7 + li * 1.7)))]);
          }
          ctx.beginPath(); ctx.moveTo(pts[0][0], y0 - pts[0][1]);
          for (let i = 1; i < pts.length; i++) { const p = pts[i - 1], q = pts[i]; ctx.quadraticCurveTo(p[0], y0 - p[1], (p[0] + q[0]) / 2, y0 - (p[1] + q[1]) / 2); }
          ctx.lineTo(pts[pts.length - 1][0], y0 + pts[pts.length - 1][1]);
          for (let i = pts.length - 1; i > 0; i--) { const p = pts[i], q = pts[i - 1]; ctx.quadraticCurveTo(p[0], y0 + p[1], (p[0] + q[0]) / 2, y0 + (p[1] + q[1]) / 2); }
          ctx.closePath(); ctx.fillStyle = ink.c; ctx.fill();
        });
      });
      ctx.globalCompositeOperation = 'source-over';
      if (opts.playhead !== false) {
        ctx.fillStyle = 'rgba(239,232,220,0.5)'; ctx.fillRect(W / 2, 0, W / 2, H);
        ctx.fillStyle = 'rgba(107,86,76,0.75)'; ctx.fillRect(Math.round(W / 2), 0, 1.5, H);
      }
    };
    return W8;
  }

  componentDidMount() {
    const $ = (id) => document.getElementById(id);
    const audio = $('rs-audio'), cv = $('rs-canvas');
    if (!audio || !cv) return;
    this.audio = audio;
    const waves = this.makeWaves(cv);
    const play = $('rs-play'), icP = $('rs-ic-play'), icS = $('rs-ic-pause');
    const seek = $('rs-seek'), cur = $('rs-cur'), dur = $('rs-dur');
    const fmt = (t) => { t = Math.max(0, Math.floor(t || 0)); const m = Math.floor(t / 60), x = t % 60; return String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0'); };
    // reloj propio: el navegador actualiza currentTime "a saltos"; aquí se interpola para un movimiento continuo
    let clockT = 0, clockAt = performance.now(), lastCT = -1;
    const now = () => {
      const ct = audio.currentTime || 0;
      if (audio.paused) { clockT = ct; clockAt = performance.now(); lastCT = ct; return ct; }
      const est = clockT + (performance.now() - clockAt) / 1000 * (audio.playbackRate || 1);
      if (ct !== lastCT) { lastCT = ct; if (Math.abs(ct - est) > 0.35) { clockT = ct; clockAt = performance.now(); return ct; } clockT = est + (ct - est) * 0.08; clockAt = performance.now(); return clockT; }
      return est;
    };
    const ui = () => {
      const playing = !audio.paused && !audio.ended;
      icP.style.display = playing ? 'none' : ''; icS.style.display = playing ? '' : 'none';
      play.setAttribute('aria-label', playing ? 'Pausar el reportaje' : 'Reproducir el reportaje');
      cur.textContent = fmt(audio.currentTime);
      if (!this.seeking) seek.value = String(Math.floor(audio.currentTime || 0));
    };
    const redraw = () => waves.draw(now());
    const loop = () => { redraw(); ui(); if (!audio.paused) this.raf = requestAnimationFrame(loop); };
    waves.load().then(redraw).catch(() => {});
    audio.addEventListener('loadedmetadata', () => { if (isFinite(audio.duration)) { seek.max = String(Math.floor(audio.duration)); dur.textContent = fmt(audio.duration); } ui(); });
    audio.addEventListener('play', () => { clockT = audio.currentTime || 0; clockAt = performance.now(); cancelAnimationFrame(this.raf); this.raf = requestAnimationFrame(loop); ui(); });
    ['pause', 'ended', 'seeked'].forEach((ev) => audio.addEventListener(ev, () => { clockT = audio.currentTime || 0; clockAt = performance.now(); ui(); redraw(); }));
    play.addEventListener('click', () => { if (audio.paused) { const p = audio.play(); if (p && p.catch) p.catch(() => {}); } else audio.pause(); });
    $('rs-back').addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 15); });
    $('rs-fwd').addEventListener('click', () => { audio.currentTime = Math.min(audio.duration || 1e9, audio.currentTime + 15); });
    seek.addEventListener('input', () => { this.seeking = true; audio.currentTime = Number(seek.value); cur.textContent = fmt(seek.value); redraw(); });
    seek.addEventListener('change', () => { this.seeking = false; });
    this.onResize = () => { waves.size(); redraw(); };
    window.addEventListener('resize', this.onResize);
    requestAnimationFrame(() => { waves.size(); redraw(); });
    // al salir de esta página el audio se pausa; al volver empieza arriba
    const root = this.root;
    try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) {}
    if (root) root.scrollTop = 0;
    const tick = () => {
      const visible = root && root.clientHeight > 0 && root.getClientRects().length > 0;
      if (!visible) { this.wasHidden = true; if (!audio.paused) audio.pause(); }
      else if (this.wasHidden) { this.wasHidden = false; root.scrollTop = 0; waves.size(); redraw(); }
      this.vis = requestAnimationFrame(tick);
    };
    this.vis = requestAnimationFrame(tick);
  }

  componentWillUnmount() {
    cancelAnimationFrame(this.raf); cancelAnimationFrame(this.vis);
    if (this.audio) this.audio.pause();
    window.removeEventListener('resize', this.onResize);
  }

  renderVals() {
    return { setRoot: this.setRoot };
  }
}

DCBoot(Component, {});
</script>
</body>
