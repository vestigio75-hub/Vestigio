<h1 class="cc-t">Cosas que sé de mí</h1>
<p class="cc-p">En Caldono, un municipio de Cauca vive Rosario, es una niña que a temprana edad fue dejada por su mamá, Amparo, en una guardería comunitaria cuando la guerrillera debe volver a las filas de las FARC tras el asesinato de su esposo a manos del Ejército. Rosario crece en un hogar del Bienestar Familiar, donde la estigmatizan y la tratan como la hija de la guerrillera, y su única aliada es su profesora, Elvira. En un pueblo donde el Ejército y los paramilitares abusan de las mujeres creyéndolas colaboradoras de la guerrilla, Rosario entra a las FARC-EP a los 14 años. Allí descubre que su cuerpo tampoco le pertenece: planificación obligatoria, vigilancia de su ciclo y ninguna decisión propia. Mantiene contacto por cartas con su profesora y, al cumplir la mayoría de edad, decide no seguir en la guerrilla. Se desmoviliza y Elvira la ayuda a estudiar y a construir una vida.</p>

<script>

class Component extends DCLogic {
  setRoot = (el) => { this.root = el; };

  componentDidMount() {
    const root = this.root;
    if (!root) return;
    const pgs = Array.from(root.querySelectorAll('.cc-pg'));
    // cada página aparece al llegar a la pantalla
    const watch = () => {
      if (!('IntersectionObserver' in window)) { pgs.forEach((p) => p.classList.add('in')); return; }
      this.io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); this.io.unobserve(e.target); } }), { root, rootMargin: '0px 0px -10% 0px', threshold: 0.05 });
      pgs.forEach((p) => this.io.observe(p));
    };
    watch();
    try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) {}
    root.scrollTop = 0;
    // al volver a esta pestaña empieza de nuevo desde arriba
    const tick = () => {
      const visible = root.clientHeight > 0 && root.getClientRects().length > 0;
      if (!visible) this.wasHidden = true;
      else if (this.wasHidden) { this.wasHidden = false; root.scrollTop = 0; pgs.forEach((p) => p.classList.remove('in')); if (this.io) this.io.disconnect(); watch(); }
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }

  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    if (this.io) this.io.disconnect();
  }

  renderVals() {
    return { setRoot: this.setRoot };
  }
}

DCBoot(Component, {});
</script>
