<script>

class Component extends DCLogic {
  setRoot = (el) => { this.root = el; };

  componentDidMount() {
    const root = this.root;
    if (!root) return;
    const pieces = Array.from(root.querySelectorAll('.pz'));
    const groups = {};
    pieces.forEach((p) => { const g = p.getAttribute('data-g'); (groups[g] = groups[g] || []).push(p); });
    // cada bloque de la infografía aparece cuando llega a la pantalla; sus partes salen una tras otra
    const show = (g) => groups[g].forEach((p) => p.classList.add('in'));
    this.io = new IntersectionObserver((es) => es.forEach((e) => {
      if (e.isIntersecting) { show(e.target.getAttribute('data-g')); this.io.unobserve(e.target); }
    }), { root: root, rootMargin: '0px 0px -12% 0px', threshold: 0.05 });
    const watch = () => Object.keys(groups).forEach((g) => this.io.observe(groups[g][0]));
    watch();
    // al volver a esta pestaña todo empieza de nuevo desde arriba
    const restart = () => {
      root.scrollTop = 0;
      pieces.forEach((p) => p.classList.remove('in'));
      this.io.disconnect(); watch();
    };
    try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) {}
    root.scrollTop = 0;
    this.forceTopUntil = performance.now() + 1000;
    const tick = () => {
      const visible = root.clientHeight > 0 && root.getClientRects().length > 0;
      if (!visible) this.wasHidden = true;
      else if (this.wasHidden) { this.wasHidden = false; restart(); this.forceTopUntil = performance.now() + 600; }
      if (performance.now() < this.forceTopUntil && root.scrollTop !== 0) root.scrollTop = 0;
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }

  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    if (this.io) this.io.disconnect();
  }

  renderVals() {
    return { setRoot: this.setRoot };
  }
}

DCBoot(Component, {});
</script>
