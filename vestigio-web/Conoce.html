<script>

class Component extends DCLogic {
  setScroller = (el) => { this.scroller = el; };
  setKin = (el) => { this.kin = el; this.vetas = null; };
  setScene = (el) => { this.scene = el; };
  setGlow = (el) => { this.glow = el; };
  setLeafL = (el) => { this.leafL = el; };
  setLeafR = (el) => { this.leafR = el; };
  setShadeL = (el) => { this.shadeL = el; };
  setShadeR = (el) => { this.shadeR = el; };
  setDark = (el) => { this.dark = el; };
  setTitle = (el) => { this.title = el; };
  setHead = (el) => { this.head = el; };
  setFoot = (el) => { this.foot = el; };
  setHint = (el) => { this.hint = el; };
  prods = [0, 1, 2, 3, 4].map(() => null);
  prodRefs = [0, 1, 2, 3, 4].map((i) => (el) => { this.prods[i] = el; });

  // se pinta directo en cada cuadro (sin re-render) para que sea fluido
  paint(u, vh) {
    const clamp = (v) => Math.min(1, Math.max(0, v));
    const ease = (t) => 0.5 - 0.5 * Math.cos(Math.PI * t);
    const p = clamp(u / (3.5 * vh));
    const open = ease(clamp(p / 0.28));                 // 1) la puerta se abre
    const z = ease(clamp((p - 0.2) / 0.55));            // 2) entramos por la puerta
    const t = ease(clamp((p - 0.38) / 0.3));            // 3) "Después" sale de adentro
    const tOut = ease(clamp((p - 0.84) / 0.16));        // 4) todo queda en negro para los productos
    const scale = Math.exp(Math.log(9) * z);
    if (this.scene) this.scene.style.transform = 'translate(-50%, -50%) scale(' + scale.toFixed(4) + ')';
    if (this.leafL) this.leafL.style.transform = 'rotateY(' + (82 * open).toFixed(2) + 'deg)';
    if (this.leafR) this.leafR.style.transform = 'rotateY(' + (-82 * open).toFixed(2) + 'deg)';
    if (this.shadeL) this.shadeL.style.opacity = (0.55 * open).toFixed(3);
    if (this.shadeR) this.shadeR.style.opacity = (0.55 * open).toFixed(3);
    if (this.glow) this.glow.style.opacity = (open * (1 - 0.4 * z)).toFixed(3);
    if (this.title) {
      // nace en la puerta (un poco más abajo del centro) y sube al centro mientras crece
      // un solo movimiento continuo (sin pausa): sigue creciendo y subiendo suave hasta irse
      const q = clamp((p - 0.38) / 0.62);
      const e = 1 - Math.pow(1 - q, 2.2);
      const ty = 9 - 13 * e;
      this.title.style.transform = 'translate3d(0, calc(-50% + ' + ty.toFixed(2) + 'vh), 0) scale(' + (0.25 + 0.9 * e).toFixed(4) + ')';
      this.title.style.opacity = (t * (1 - tOut)).toFixed(3);
    }
    if (this.dark) this.dark.style.opacity = (0.35 * z + 0.65 * tOut).toFixed(3);
    const ui = (1 - clamp((p - 0.5) / 0.3)).toFixed(3);
    if (this.head) this.head.style.opacity = ui;
    // "Desliza" se queda visible mientras sale "Después" y se va justo antes de los productos
    if (this.hint) this.hint.style.opacity = (1 - clamp((p - 0.78) / 0.12)).toFixed(3);
  }

  // el título se dibuja una sola vez como imagen (canvas) en alta resolución:
  // así el navegador solo la escala en cada cuadro y las letras no se traban ni "saltan"
  makeTitleCanvas() {
    const h = this.title;
    if (!h) return;
    try {
      const cs = getComputedStyle(h);
      const fs = parseFloat(cs.fontSize) || 160;
      const ls = parseFloat(cs.letterSpacing) || 0;
      const text = (h.getAttribute('aria-label') || h.textContent || '').trim();
      const font = cs.fontWeight + ' ' + fs + 'px ' + cs.fontFamily;
      const c = this.titleCanvas || document.createElement('canvas');
      let ctx = c.getContext('2d');
      const native = 'letterSpacing' in ctx;
      const measure = () => {
        ctx.font = font;
        if (native) { ctx.letterSpacing = ls + 'px'; return ctx.measureText(text).width; }
        let w = 0; for (const ch of text) w += ctx.measureText(ch).width + ls; return w - ls;
      };
      const w = measure();
      const pad = Math.ceil(fs * 0.25 + 40);
      const cssW = Math.ceil(w + pad * 2), cssH = Math.ceil(fs * 1.3 + pad * 2);
      let R = (window.devicePixelRatio || 1) * 1.25;
      R = Math.min(R, 8000 / cssW, 8000 / cssH);
      c.width = Math.round(cssW * R); c.height = Math.round(cssH * R);
      ctx = c.getContext('2d');
      ctx.setTransform(R, 0, 0, R, 0, 0);
      measure();
      const m = ctx.measureText(text);
      const asc = m.fontBoundingBoxAscent || fs * 0.9, desc = m.fontBoundingBoxDescent || fs * 0.25;
      const y = cssH / 2 + (asc - desc) / 2;
      ctx.fillStyle = cs.color && cs.color !== 'rgba(0, 0, 0, 0)' && !this.titleCanvas ? cs.color : '#FFFFFF';
      ctx.shadowColor = 'rgba(0,0,0,0.4)';
      ctx.shadowBlur = 30 * R; ctx.shadowOffsetY = 6 * R;
      if (native) { ctx.textAlign = 'center'; ctx.fillText(text, cssW / 2 + ls / 2, y); }
      else {
        let x = (cssW - w) / 2;
        for (const ch of text) { ctx.fillText(ch, x, y); x += ctx.measureText(ch).width + ls; }
      }
      c.setAttribute('aria-hidden', 'true');
      c.style.cssText = 'position:absolute;left:50%;top:50%;width:' + cssW + 'px;height:' + cssH + 'px;transform:translate(-50%,-50%);pointer-events:none';
      if (!this.titleCanvas) { h.setAttribute('aria-label', text); h.appendChild(c); this.titleCanvas = c; }
      h.style.color = 'transparent'; h.style.textShadow = 'none';
    } catch (e) {}
  }

  // portada del reportaje: ondas quietas dibujadas con el audio real
  setupAudio() {
    const cv = document.getElementById('rs-cover');
    if (!cv) return;
    const waves = this.makeWaves(cv);
    const draw = () => { waves.size(); waves.draw(612, { playhead: false }); };
    waves.load().then(draw).catch(() => {});
    this.rsResize = draw;
    window.addEventListener('resize', this.rsResize);
  }

  // ===== ondas del reportaje sonoro: tinta de colores superpuesta, movimiento continuo =====
  makeWaves(cv) {
    const W8 = { W: 0, H: 0, dpr: 1, sm: null, fps: 20, nb: 4, frames: 0 };
    const INK = [
      { c: 'rgba(142,163,238,0.85)', o: -0.35 }, // azul
      { c: 'rgba(168,196,80,0.85)', o: 0.2 },    // verde
      { c: 'rgba(222,206,98,0.9)', o: 0.55 },    // amarillo
      { c: 'rgba(107,86,76,0.5)', o: -0.1 },     // café
    ];
    const ROWS = [
      { y: 0.2, a: 0.13, m: [2, 3, 0, 1] },
      { y: 0.5, a: 0.24, m: [0, 1, 2, 3] },
      { y: 0.8, a: 0.13, m: [1, 0, 3, 2] },
    ];
    W8.load = () => fetch('assets/962c9a80cd446981c12a9bf5a058bdbc.json').then((r) => r.json()).then((j) => {
      const bin = atob(j.data), n = bin.length, nb = j.bands, fr = Math.floor(n / nb);
      // suavizado gaussiano por banda (≈0,35 s) para que las ondas respiren sin temblar
      const sig = 7, R = sig * 3, ker = [];
      let ks = 0; for (let d = -R; d <= R; d++) { const w = Math.exp(-(d * d) / (2 * sig * sig)); ker.push(w); ks += w; }
      const sm = [];
      for (let k = 0; k < nb; k++) {
        const raw = new Float32Array(fr); for (let i = 0; i < fr; i++) raw[i] = bin.charCodeAt(i * nb + k) / 255;
        const out = new Float32Array(fr);
        for (let i = 0; i < fr; i++) { let a = 0; for (let d = -R; d <= R; d++) { const q = Math.min(fr - 1, Math.max(0, i + d)); a += raw[q] * ker[d + R]; } out[i] = a / ks; }
        sm.push(out);
      }
      W8.sm = sm; W8.fps = j.fps; W8.nb = nb; W8.frames = fr;
    });
    const val = (k, t) => {
      if (!W8.sm || t < 0) return 0;
      const f = t * W8.fps, i = Math.floor(f), a = f - i, s = W8.sm[k];
      if (i >= W8.frames - 1) return 0;
      return s[i] * (1 - a) + s[i + 1] * a;
    };
    W8.size = () => {
      const r = cv.getBoundingClientRect(); W8.dpr = Math.min(2, window.devicePixelRatio || 1);
      W8.W = Math.max(1, r.width); W8.H = Math.max(1, r.height);
      cv.width = Math.round(W8.W * W8.dpr); cv.height = Math.round(W8.H * W8.dpr);
    };
    W8.draw = (T, opts) => {
      opts = opts || {};
      if (!W8.W) W8.size();
      const W = W8.W, H = W8.H, ctx = cv.getContext('2d'); if (!ctx) return;
      ctx.setTransform(W8.dpr, 0, 0, W8.dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      const SPAN = Math.max(6, Math.min(14, W / 85));
      const start = T - SPAN / 2, N = Math.ceil(W / 7) + 2, dt = SPAN / (N - 2);
      const i0 = Math.floor(start / dt) - 1; // la rejilla va pegada al tiempo: la forma se desliza entera, no tiembla
      ctx.globalCompositeOperation = 'multiply';
      ROWS.forEach((row) => {
        const y0 = row.y * H, A = row.a * H * 1.2;
        INK.forEach((ink, li) => {
          const k = row.m[li], pts = [];
          for (let i = 0; i <= N + 1; i++) {
            const t = (i0 + i) * dt, x = (t - start) / SPAN * W;
            const v = Math.pow(val(k, t + ink.o), 1.3);
            pts.push([x, Math.max(0.5, v * A * (0.8 + 0.2 * Math.sin(t * 0.7 + li * 1.7)))]);
          }
          ctx.beginPath(); ctx.moveTo(pts[0][0], y0 - pts[0][1]);
          for (let i = 1; i < pts.length; i++) { const p = pts[i - 1], q = pts[i]; ctx.quadraticCurveTo(p[0], y0 - p[1], (p[0] + q[0]) / 2, y0 - (p[1] + q[1]) / 2); }
          ctx.lineTo(pts[pts.length - 1][0], y0 + pts[pts.length - 1][1]);
          for (let i = pts.length - 1; i > 0; i--) { const p = pts[i], q = pts[i - 1]; ctx.quadraticCurveTo(p[0], y0 + p[1], (p[0] + q[0]) / 2, y0 + (p[1] + q[1]) / 2); }
          ctx.closePath(); ctx.fillStyle = ink.c; ctx.fill();
        });
      });
      ctx.globalCompositeOperation = 'source-over';
      if (opts.playhead !== false) {
        ctx.fillStyle = 'rgba(239,232,220,0.5)'; ctx.fillRect(W / 2, 0, W / 2, H);
        ctx.fillStyle = 'rgba(107,86,76,0.75)'; ctx.fillRect(Math.round(W / 2), 0, 1.5, H);
      }
    };
    return W8;
  }

  // video de La Roja: en loop y sin sonido; el botón activa o quita el sonido
  setupRoja() {
    const v = document.getElementById('roja-video'), b = document.getElementById('roja-sound');
    if (!v || !b) return;
    this.roja = v;
    const icOff = document.getElementById('roja-ic-off'), icOn = document.getElementById('roja-ic-on');
    const ui = () => { icOff.style.display = v.muted ? '' : 'none'; icOn.style.display = v.muted ? 'none' : ''; b.setAttribute('aria-label', v.muted ? 'Activar sonido' : 'Quitar sonido'); };
    b.addEventListener('click', () => { v.muted = !v.muted; if (v.paused) { const p = v.play(); if (p && p.catch) p.catch(() => {}); } ui(); });
    const p = v.play(); if (p && p.catch) p.catch(() => {});
    ui();
    this.rojaUi = ui;
  }

  componentDidMount() {
    this.setupRoja();
    this.onTitleResize = () => { clearTimeout(this.trT); this.trT = setTimeout(() => this.makeTitleCanvas(), 150); };
    window.addEventListener('resize', this.onTitleResize);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => this.makeTitleCanvas()); else this.makeTitleCanvas();
    this.trT2 = setTimeout(() => this.makeTitleCanvas(), 1500);
    // la animación arranca siempre desde el principio al entrar a la sección
    this.setupAudio();
    this.reset = () => {
      if (this.roja) { this.roja.muted = true; if (this.rojaUi) this.rojaUi(); }
      if (this.scroller) this.scroller.scrollTop = 0;
      this.su = 0; this.lastU = null; this.lastProg = null; this.goldP = 0;
      this.setState({ u: 0, r1: false, r2: false, seen: null });
    };
    try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) {}
    // algunos navegadores (p. ej. Chrome/Edge en Windows) restauran el scroll después de montar:
    // durante el primer segundo se fuerza volver arriba
    this.forceTopUntil = performance.now() + 1000;
    this.reset();
    this.onVis = () => { if (document.hidden) this.reset(); else { this.reset(); this.forceTopUntil = performance.now() + 600; } };
    document.addEventListener('visibilitychange', this.onVis);
    window.addEventListener('pageshow', this.reset);
    if (window.IntersectionObserver && this.scroller) {
      this.io = new IntersectionObserver((entries) => {
        entries.forEach((e) => { if (!e.isIntersecting) this.reset(); });
      });
      this.io.observe(this.scroller);
    }
    const tick = () => {
      const el = this.scroller;
      if (el) {
        // si la sección estuvo oculta (otra sección / otra pestaña) y vuelve a verse, empieza de cero
        const visible = el.clientHeight > 0 && el.getClientRects().length > 0;
        if (!visible) this.wasHidden = true;
        else if (this.wasHidden) { this.wasHidden = false; this.reset(); this.forceTopUntil = performance.now() + 600; }
        if (performance.now() < this.forceTopUntil && el.scrollTop !== 0) { el.scrollTop = 0; this.su = 0; }
        const target = el.scrollTop;
        this.su = this.su == null ? target : this.su + (target - this.su) * 0.1;
        if (Math.abs(target - this.su) < 0.05) this.su = target;
        const vh = el.clientHeight || 900;
        if (this.su !== this.lastU || vh !== this.lastVh) {
          this.paint(this.su, vh);
          this.lastU = this.su; this.lastVh = vh;
        }
        const s = this.state || {};
        const seen = this.prods.map((n, i) => !!((s.seen && s.seen[i]) || (n && n.getBoundingClientRect().top < vh * 0.85)));
        if (!s.seen || seen.some((v, i) => v !== s.seen[i])) this.setState({ seen: seen });
        // el oro va "pegando" las grietas a medida que bajas por los productos
        if (this.kin) {
          if (!this.vetas) this.vetas = Array.from(this.kin.querySelectorAll('.oro-veta')).map((e) => ({ el: e, d: parseFloat(e.getAttribute('data-delay')) || 0 }));
          const kr = this.kin.getBoundingClientRect();
          const target = Math.min(1, Math.max(0, (vh * 0.9 - kr.top) / Math.max(1, kr.height - vh * 0.1))); // llega a 1 al final de la página // primero se ve roto, luego el oro rellena
          // el oro avanza despacio, como líquido, siguiendo al scroll con retraso
          this.goldP = this.goldP == null ? 0 : this.goldP + (target - this.goldP) * 0.018;
          if (Math.abs(target - this.goldP) < 0.0005) this.goldP = target;
          const prog = this.goldP;
          if (prog !== this.lastProg) {
            this.lastProg = prog;
            this.vetas.forEach((v) => {
              const k = Math.min(1, Math.max(0, (prog - v.d) / 0.5)); // todas terminan cuando prog = 1
              v.el.style.strokeDashoffset = (1 - k).toFixed(4);
            });
          }
        }
      }
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }

  componentWillUnmount() {
    window.removeEventListener('resize', this.onTitleResize);
    clearTimeout(this.trT); clearTimeout(this.trT2);
    document.removeEventListener('visibilitychange', this.onVis);
    window.removeEventListener('pageshow', this.reset);
    if (this.io) this.io.disconnect();
    cancelAnimationFrame(this.raf);
    window.removeEventListener('resize', this.rsResize);
  }

  renderVals() {
    const st = this.state || {};
    const seen = st.seen || [];
    return {
      setScroller: this.setScroller, setKin: this.setKin, setScene: this.setScene, setGlow: this.setGlow,
      setLeafL: this.setLeafL, setLeafR: this.setLeafR, setShadeL: this.setShadeL, setShadeR: this.setShadeR,
      setDark: this.setDark, setTitle: this.setTitle, setHead: this.setHead, setFoot: this.setFoot, setHint: this.setHint,
      ref0: this.prodRefs[0], ref1: this.prodRefs[1], ref2: this.prodRefs[2], ref3: this.prodRefs[3], ref4: this.prodRefs[4],
      p0: { op: seen[0] ? 1 : 0, y: seen[0] ? 0 : 60 },
      p1: { op: seen[1] ? 1 : 0, y: seen[1] ? 0 : 60 },
      p2: { op: seen[2] ? 1 : 0, y: seen[2] ? 0 : 60 },
      p3: { op: seen[3] ? 1 : 0, y: seen[3] ? 0 : 60 },
      p4: { op: seen[4] ? 1 : 0, y: seen[4] ? 0 : 60 },
    };
  }
}
