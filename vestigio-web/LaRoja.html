<template id="dc-template"><x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#D9C7B1}
#laroja{--bar:52px;--cafe:#6B564C;--roja:#B3261E;--crema:#F4EFE6;--g:clamp(14px,1.6vw,24px);position:relative;height:100vh;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:#D9C7B1;color:var(--cafe);font-family:Inter,sans-serif}
#laroja *{box-sizing:border-box}
#laroja,#laroja *{cursor:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2732%27 height=%2732%27 viewBox=%270 0 32 32%27%3E%3Cg transform=%27rotate%28-20 16 16%29%27%3E%3Crect x=%2713.5%27 y=%271%27 width=%275%27 height=%273%27 rx=%271%27 fill=%27%23B3261E%27/%3E%3Cpath d=%27M14 4h4v5c0 1.5 4 3 4 7v13a2 2 0 0 1-2 2h-8a2 2 0 0 1-2-2V16c0-4 4-5.5 4-7z%27 fill=%27%237A4A1E%27 stroke=%27%233B2E28%27 stroke-width=%271.2%27/%3E%3Crect x=%2710.6%27 y=%2717%27 width=%2710.8%27 height=%277%27 fill=%27%23B3261E%27/%3E%3Cpath d=%27M16 18.2l.9 1.9 2 .2-1.5 1.3.5 2-1.9-1-1.9 1 .5-2-1.5-1.3 2-.2z%27 fill=%27%23F4EFE6%27/%3E%3Cpath d=%27M12.2 12.5c.6-1 1.6-1.6 1.6-3%27 stroke=%27%23E9C98A%27 stroke-width=%271%27 fill=%27none%27 stroke-linecap=%27round%27/%3E%3C/g%3E%3C/svg%3E") 11 3,auto}

.lr-bar{position:fixed;top:0;left:0;right:0;height:var(--bar);z-index:30;display:flex;align-items:center;padding:0 clamp(12px,3vw,28px);background:rgba(217,199,177,.95);border-bottom:1px solid rgba(107,86,76,.3)}
.lr-back{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 4px;color:var(--cafe);text-decoration:none;font-weight:600;font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.lr-back:hover{text-decoration:underline;text-underline-offset:4px}
.lr-back:focus-visible,.lr-play:focus-visible,.lr-end a:focus-visible{outline:2px solid var(--cafe);outline-offset:3px}
/* lámina estilo editorial */
.lr-sheet{min-height:100vh;padding:calc(var(--bar) + var(--g)) var(--g) var(--g);display:grid;grid-template-columns:minmax(250px,27%) 1fr;grid-template-rows:1fr auto;column-gap:var(--g);row-gap:clamp(4px,1vh,12px)}
.lr-side{display:flex;flex-direction:column;justify-content:space-between;min-height:0;gap:20px}
.lr-num{margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(64px,8.6vw,138px);line-height:.82;letter-spacing:-.05em}
.lr-kick{margin:clamp(10px,1.6vh,18px) 0 0;font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase}
.lr-title{margin:6px 0 0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(20px,2vw,30px);line-height:1;letter-spacing:-.015em;text-transform:uppercase}
.lr-by{margin:12px 0 0;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.lr-by b{font-weight:700}
.lr-sum{margin:0;font-size:clamp(10.5px,.82vw,12.5px);line-height:1.45;font-weight:600;text-transform:uppercase;letter-spacing:.01em;max-width:380px}
.lr-links{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:14px}
.lr-play{display:inline-flex;align-items:center;gap:10px;padding:10px 16px 10px 12px;border:0;border-radius:999px;background:var(--cafe);color:var(--crema);font:600 11px Inter,sans-serif;letter-spacing:.2em;text-transform:uppercase;cursor:inherit;transition:background .25s}
.lr-play:hover{background:var(--roja)}
.lr-play .tri{width:22px;height:22px;border-radius:50%;background:var(--crema);display:grid;place-items:center;color:var(--cafe)}
.lr-yt{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--cafe);text-underline-offset:3px}
.lr-media{position:relative;min-height:0;background:#1B1B1B;overflow:hidden;clip-path:inset(0 0 100% 0);animation:lrWipe 1.1s .15s cubic-bezier(.7,0,.2,1) forwards}
.lr-media video,.lr-media iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;object-fit:cover}
.lr-media .tag{position:absolute;left:12px;bottom:12px;z-index:2;padding:6px 10px;background:rgba(27,27,27,.55);color:var(--crema);font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;border-radius:4px;pointer-events:none}
.lr-media.yt .tag{display:none}
@keyframes lrWipe{to{clip-path:inset(0 0 0 0)}}
.lr-big{grid-column:1 / -1;margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;line-height:.78;letter-spacing:-.045em;white-space:nowrap;color:var(--roja);font-size:19vw;overflow:hidden;padding-top:.04em}
.lr-big .in{display:inline-block}
.lr-big .ch{display:inline-block;transform:translateY(105%);animation:lrRise .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes lrRise{to{transform:none}}
.lr-side > *{opacity:0;animation:lrFade .8s cubic-bezier(.2,.8,.2,1) forwards}
.lr-side > :nth-child(1){animation-delay:.1s}.lr-side > :nth-child(2){animation-delay:.45s}
@keyframes lrFade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.lr-end{text-align:center;padding:clamp(30px,6vh,60px) 16px clamp(50px,9vh,90px)}
.lr-end a{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;border:2px solid var(--cafe);color:var(--cafe);text-decoration:none;font-weight:600;font-size:12px;letter-spacing:.2em;text-transform:uppercase;transition:background .3s,color .3s}
.lr-end a:hover{background:var(--cafe);color:var(--crema)}
@media(max-width:820px){
 .lr-sheet{grid-template-columns:1fr;grid-template-rows:auto;min-height:0;row-gap:18px}
 .lr-side{display:contents}
 .lr-head{order:1}
 .lr-media{order:2;aspect-ratio:16/9}
 .lr-foot{order:3}
 .lr-big{order:4}
 .lr-sum{font-size:12.5px;max-width:none}
 .lr-head,.lr-foot{opacity:0;animation:lrFade .8s .2s cubic-bezier(.2,.8,.2,1) forwards}
}
@media(prefers-reduced-motion:reduce){
 #laroja *{animation:none!important;transition:none!important}
 .lr-media{clip-path:none}
 .lr-big .in{display:inline-block}
.lr-big .ch{transform:none}
 .lr-side > *,.lr-head,.lr-foot{opacity:1}
}
</style>
</helmet>
<div id="laroja" ref="{{ setRoot }}">
<div class="lr-bar"><a class="lr-back" href="Conoce.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>Volver a Memoria</a></div>
<main class="lr-sheet">
<div class="lr-side">
<div class="lr-head">
<p class="lr-num" aria-hidden="true">00-4</p>
<p class="lr-kick">Video reportaje</p>
<h1 class="lr-title">La Roja: cuando la paz se fábrica.</h1>
<p class="lr-by">Realizado por: <b>Valentina Martínez</b></p>
</div>
<div class="lr-foot">
<p class="lr-sum">El conflicto armado deja marcas profundas en los actores, a partir de estas vivencias y del acuerdo de paz del 2016 se impulsan procesos de resiliencia y reincorporación en las personas firmantes de las FARC-EP. A través de procesos productivos, las manualidades, la creación de objetos o la producción de nuevas cervezas, muchas personas encuentran una forma de procesar y de reincorporación a la vida civil después del conflicto así como José Mayorga “Arley”, firmante de paz y socio de La Roja Cerveza Artesanal y ASOROJA.</p>
<div class="lr-links">
<button class="lr-play" id="lr-play" type="button"><span class="tri" aria-hidden="true"><svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor"><path d="M2 1l7 4-7 4z"/></svg></span>Ver video completo</button>
<a class="lr-yt" href="https://youtu.be/T_Mk8Ti9Vvk" target="_blank" rel="noopener noreferrer">YouTube ↗</a>
</div>
</div>
</div>
<div class="lr-media" id="lr-media">
<video id="lr-frag" src="assets/f159946bd2fd8cb827ab1e944a781a62.mp4" poster="assets/3f437bb729913d97fd3206e265a029f7.webp" autoplay muted loop playsinline preload="auto" aria-label="Fragmento del video La Roja"></video>
<span class="tag">Fragmento</span>

<div class="lr-end"><a href="Conoce.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>Volver a Memoria</a></div>
</div>
</x-dc></template>

<script>

class Component extends DCLogic {
  setRoot = (el) => { this.root = el; };

  componentDidMount() {
    const root = this.root;
    if (!root) return;
    try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) {}
    root.scrollTop = 0;
    const media = document.getElementById('lr-media'), frag = document.getElementById('lr-frag');
    const big = document.getElementById('lr-big'), play = document.getElementById('lr-play');
    let yt = null;
    const ytCmd = (f) => { try { yt && yt.contentWindow.postMessage(JSON.stringify({ event: 'command', func: f, args: [] }), '*'); } catch (e) {} };

    // "LA ROJA" ocupa todo el ancho, como en la lámina
    const fit = () => {
      if (!big) return;
      const inn = document.getElementById('lr-big-in'); if (!inn) return;
      const chs = inn.querySelectorAll('.ch');
      chs.forEach((c) => { c.style.marginRight = '0px'; });
      big.style.fontSize = '100px';
      const w = inn.getBoundingClientRect().width, avail = big.clientWidth;
      if (!(w > 0 && avail > 0)) return;
      const wide = window.innerWidth > 820;
      const cap = wide ? (root.clientHeight * 0.3) / 0.8 : 1e9;
      const fs = Math.min(100 * avail / w * 0.995, cap);
      big.style.fontSize = fs.toFixed(2) + 'px';
      const extra = (avail * 0.995 - inn.getBoundingClientRect().width) / Math.max(1, chs.length - 1);
      if (extra > 1) for (let i = 0; i < chs.length - 1; i++) chs[i].style.marginRight = extra.toFixed(2) + 'px';
    };
    this.onResize = fit;
    window.addEventListener('resize', fit);
    fit();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

    // el fragmento se cambia por el video completo de YouTube
    this.onPlay = () => {
      if (yt) return;
      if (frag) { frag.pause(); frag.remove(); }
      yt = document.createElement('iframe');
      yt.src = 'https://www.youtube-nocookie.com/embed/T_Mk8Ti9Vvk?rel=0&enablejsapi=1&autoplay=1';
      yt.title = 'La Roja: cuando la paz se fábrica (video en YouTube)';
      yt.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
      yt.referrerPolicy = 'strict-origin-when-cross-origin';
      yt.allowFullscreen = true;
      media.appendChild(yt); media.classList.add('yt');
      play.disabled = true; play.lastChild.textContent = 'Reproduciendo';
      if (window.innerWidth <= 820) media.scrollIntoView({ behavior: 'smooth', block: 'center' });
    };
    if (play) play.addEventListener('click', this.onPlay);

    // al salir de esta pestaña se pausa; al volver empieza arriba
    const tick = () => {
      const visible = root.clientHeight > 0 && root.getClientRects().length > 0;
      if (!visible) { if (!this.wasHidden) { ytCmd('pauseVideo'); if (frag && frag.isConnected) frag.pause(); } this.wasHidden = true; }
      else if (this.wasHidden) { this.wasHidden = false; root.scrollTop = 0; fit(); if (frag && frag.isConnected) frag.play().catch(() => {}); }
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }

  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    window.removeEventListener('resize', this.onResize);
  }

  renderVals() {
    return { setRoot: this.setRoot };
  }
}

DCBoot(Component, {});
</script>
