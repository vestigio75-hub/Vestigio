<script>

class Component extends DCLogic {
  setRoot = (el) => { this.root = el; };

  componentDidMount() {
    const root = this.root;
    if (!root) return;
    try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) {}
    root.scrollTop = 0;
    const yt = document.getElementById('lr-yt'), media = document.getElementById('lr-media');
    const big = document.getElementById('lr-big'), vcol = document.getElementById('lr-vcol');
    const ytCmd = (f) => { try { yt && yt.contentWindow.postMessage(JSON.stringify({ event: 'command', func: f, args: [] }), '*'); } catch (e) {} };

    // palabra gigante de lado a lado y video que cabe en la primera pantalla
    const layout = () => {
      if (!big) return;
      big.style.fontSize = '100px';
      const w = Math.max(...Array.from(big.querySelectorAll('.ln')).map((l) => l.getBoundingClientRect().width)), avail = big.clientWidth;
      if (w > 0 && avail > 0) big.style.fontSize = (100 * avail / w * 0.995).toFixed(2) + 'px';
      if (!media) return;
      media.style.width = ''; media.style.height = ''; media.style.aspectRatio = '';
      if (window.innerWidth <= 820) return;
      const cs = getComputedStyle(document.getElementById('lr-sheet'));
      const padT = parseFloat(cs.paddingTop) || 0, padB = parseFloat(cs.paddingBottom) || 0, gap = parseFloat(cs.rowGap) || 0;
      const lk = vcol ? vcol.querySelector('.lr-yt') : null;
      const maxH = root.clientHeight - padT - padB - gap - big.getBoundingClientRect().height - (lk ? lk.getBoundingClientRect().height + 10 : 0);
      const mw = media.getBoundingClientRect().width;
      media.style.height = '';
      if (maxH > 200) { media.style.aspectRatio = 'auto'; media.style.height = Math.floor(Math.min(maxH, mw * 0.75)) + 'px'; }
    };
    this.onResize = layout;
    window.addEventListener('resize', layout);
    layout();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);

    // resumen: las letras se escriben una a una
    const sum = document.getElementById('lr-sum');
    const cs2 = sum ? Array.from(sum.querySelectorAll('.c')) : [];
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.type = () => {
      clearInterval(this.tw);
      if (this.cur) this.cur.remove();
      cs2.forEach((c) => c.classList.remove('on'));
      if (reduce || !cs2.length) { cs2.forEach((c) => c.classList.add('on')); return; }
      const cur = document.createElement('span'); cur.className = 'cur'; cur.setAttribute('aria-hidden', 'true'); this.cur = cur;
      let i = 0; const per = 3;
      this.tw = setInterval(() => {
        for (let k = 0; k < per && i < cs2.length; k++, i++) cs2[i].classList.add('on');
        if (i < cs2.length) cs2[i - 1].after(cur);
        else { clearInterval(this.tw); setTimeout(() => cur.remove(), 1600); cs2[cs2.length - 1].after(cur); }
      }, 16);
    };
    this.tStart = setTimeout(this.type, 700);

    // al salir de esta pestaña se pausa; al volver empieza arriba
    const tick = () => {
      const visible = root.clientHeight > 0 && root.getClientRects().length > 0;
      if (!visible) { if (!this.wasHidden) ytCmd('pauseVideo'); this.wasHidden = true; }
      else if (this.wasHidden) { this.wasHidden = false; root.scrollTop = 0; layout(); this.type(); }
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }

  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    clearInterval(this.tw); clearTimeout(this.tStart);
    window.removeEventListener('resize', this.onResize);
  }

  renderVals() {
    return { setRoot: this.setRoot };
  }
}

DCBoot(Component, {});
</script>
