<script>

class Component extends DCLogic {
  setRoot = (el) => { this.root = el; };

  componentDidMount() {
    const root = this.root;
    if (!root) return;
    try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) {}
    root.scrollTop = 0;
    const yt = document.getElementById('lr-yt');
    const ytCmd = (f) => { try { yt && yt.contentWindow.postMessage(JSON.stringify({ event: 'command', func: f, args: [] }), '*'); } catch (e) {} };
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

    // resumen: las letras caen al abrir y luego reaccionan al puntero
    const body = document.getElementById('lr-body'), sum = document.getElementById('lr-sum'), big = document.getElementById('lr-big');
    const cs2 = sum ? Array.from(sum.querySelectorAll('.c')) : [];
    let ready = false, boxes = null;
    this.play = () => {
      clearTimeout(this.tw); ready = false;
      cs2.forEach((c) => { c.classList.remove('on', 'hot'); c.style.transform = ''; c.style.transitionDelay = ''; });
      if (reduce) { cs2.forEach((c) => c.classList.add('on')); ready = true; return; }
      void sum.offsetWidth;
      cs2.forEach((c, i) => { c.style.transitionDelay = (0.8 + i * 0.003).toFixed(3) + 's'; c.classList.add('on'); });
      this.tw = setTimeout(() => { cs2.forEach((c) => { c.style.transitionDelay = ''; }); ready = true; }, 800 + cs2.length * 3 + 900);
    };
    this.reset = () => { if (body) body.classList.remove('on'); this.play(); };
    this.play();
    // el resumen se desvanece al bajar
    const fade = () => {
      if (!sum) return;
      const r = sum.getBoundingClientRect(), r0 = root.getBoundingClientRect();
      const y = r.top - r0.top, vh = root.clientHeight;
      const k = Math.max(0, Math.min(1, (vh * 0.4 - y) / (vh * 0.4 + r.height * 0.4)));
      sum.style.opacity = (1 - k * 0.92).toFixed(3);
    };
    root.addEventListener('scroll', fade, { passive: true });
    // texto final de lado a lado
    const fit = () => {
      if (!big) return;
      big.style.fontSize = '100px';
      const w = Math.max(...Array.from(big.querySelectorAll('.ln')).map((l) => l.scrollWidth));
      const avail = big.clientWidth;
      if (w > 0 && avail > 0) big.style.fontSize = (100 * avail / w * 0.99).toFixed(2) + 'px';
    };
    this.onResize = () => { fit(); fade(); };
    window.addEventListener('resize', this.onResize);
    fit();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
    if (body) {
      if (!('IntersectionObserver' in window) || reduce) body.classList.add('on');
      else {
        this.io = new IntersectionObserver((es) => { es.forEach((e) => { if (e.isIntersecting) body.classList.add('on'); }); }, { root, threshold: 0.3 });
        this.io.observe(body);
      }
    }
    if (sum && !reduce) {
      sum.addEventListener('pointerenter', () => { boxes = cs2.map((c) => { const r = c.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }); });
      sum.addEventListener('pointermove', (e) => {
        if (!ready || !boxes) return;
        const R = 70;
        for (let i = 0; i < cs2.length; i++) {
          const dx = boxes[i][0] - e.clientX, dy = boxes[i][1] - e.clientY;
          const d = Math.sqrt(dx * dx + dy * dy);
          const k = d < R ? 1 - d / R : 0;
          cs2[i].style.transform = k ? 'translateY(' + (-k * 0.5).toFixed(2) + 'em) scale(' + (1 + k * 0.22).toFixed(2) + ')' : '';
          cs2[i].classList.toggle('hot', k > 0.35);
        }
      });
      sum.addEventListener('pointerleave', () => { cs2.forEach((c) => { c.style.transform = ''; c.classList.remove('hot'); }); boxes = null; });
      root.addEventListener('scroll', () => { boxes = null; }, { passive: true });
    }

    // al salir de esta pestaña se pausa; al volver empieza arriba
    const tick = () => {
      const visible = root.clientHeight > 0 && root.getClientRects().length > 0;
      if (!visible) { if (!this.wasHidden) ytCmd('pauseVideo'); this.wasHidden = true; }
      else if (this.wasHidden) { this.wasHidden = false; root.scrollTop = 0; this.reset(); }
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }

  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    window.removeEventListener('resize', this.onResize);
    clearTimeout(this.tw);
    if (this.io) this.io.disconnect();
  }

  renderVals() {
    return { setRoot: this.setRoot };
  }
}

DCBoot(Component, {});
</script>
