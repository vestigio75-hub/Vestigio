<p class="lr-p">El conflicto armado deja marcas profundas en los actores, a partir de estas vivencias y del acuerdo de paz del 2016 se impulsan procesos de resiliencia y reincorporación en las personas firmantes de las FARC-EP. A través de procesos productivos, las manualidades, la creación de objetos o la producción de nuevas cervezas, muchas personas encuentran una forma de procesar y de reincorporación a la vida civil después del conflicto así como José Mayorga “Arley”, firmante de paz y socio de La Roja Cerveza Artesanal y ASOROJA.</p>

<script>

class Component extends DCLogic {
  setRoot = (el) => { this.root = el; };

  componentDidMount() {
    const root = this.root, yt = document.getElementById('lr-yt');
    const pause = () => { try { yt.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'pauseVideo', args: [] }), '*'); } catch (e) {} };
    if (!root) return;
    try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) {}
    root.scrollTop = 0;
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

    // pasos del proceso: se llenan al entrar en pantalla
    const steps = document.getElementById('lr-steps');
    if (steps) {
      if (reduce || !('IntersectionObserver' in window)) steps.classList.add('on');
      else {
        this.io = new IntersectionObserver((es) => { es.forEach((e) => { if (e.isIntersecting) { steps.classList.add('on'); this.io.disconnect(); } }); }, { root, threshold: 0.35 });
        this.io.observe(steps);
      }
    }

    // burbujas de cerveza
    const cv = document.getElementById('lr-bub'), ctx = cv && cv.getContext('2d');
    const bubs = [];
    let W = 0, H = 0, dpr = 1;
    const size = () => { dpr = Math.min(2, window.devicePixelRatio || 1); W = root.clientWidth; H = root.clientHeight; if (cv) { cv.width = W * dpr; cv.height = H * dpr; } };
    const add = (x, y, burst) => bubs.push({ x, y, r: burst ? 3 + Math.random() * 7 : 2 + Math.random() * 9, v: burst ? 0.8 + Math.random() * 1.6 : 0.25 + Math.random() * 0.7, ph: Math.random() * 6.28, a: burst ? 0.9 : 0.35 + Math.random() * 0.4, vx: burst ? (Math.random() - 0.5) * 2.4 : 0 });
    size();
    for (let i = 0; i < 26; i++) add(Math.random() * W, Math.random() * H, false);
    this.onResize = () => size();
    window.addEventListener('resize', this.onResize);
    this.onDown = (e) => { if (reduce || e.target.closest('a,iframe,button')) return; const r = root.getBoundingClientRect(); const x = e.clientX - r.left, y = e.clientY - r.top; for (let i = 0; i < 12; i++) add(x + (Math.random() - 0.5) * 20, y + (Math.random() - 0.5) * 20, true); };
    root.addEventListener('pointerdown', this.onDown);
    let last = 0, sTop = root.scrollTop;
    const draw = (t) => {
      if (!ctx) return;
      const dt = Math.min(3, last ? (t - last) / 16.7 : 1); last = t;
      const ds = root.scrollTop - sTop; sTop = root.scrollTop;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      if (!reduce && bubs.length < 34 && Math.random() < 0.05 * dt) add(Math.random() * W, H + 12, false);
      for (let i = bubs.length - 1; i >= 0; i--) {
        const b = bubs[i];
        if (!reduce) { b.y -= b.v * dt + ds * 0.15; b.ph += 0.03 * dt; b.x += Math.sin(b.ph) * 0.35 * dt + b.vx * dt; b.vx *= 0.96; }
        if (b.y < -20 || b.y > H + 40) { if (b.vx !== 0 || bubs.length > 30) { bubs.splice(i, 1); continue; } b.y = H + 12; b.x = Math.random() * W; }
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.2832);
        ctx.fillStyle = 'rgba(244,239,230,' + (b.a * 0.45) + ')'; ctx.fill();
        ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(201,138,43,' + b.a + ')'; ctx.stroke();
        ctx.beginPath(); ctx.arc(b.x - b.r * 0.35, b.y - b.r * 0.35, Math.max(0.8, b.r * 0.22), 0, 6.2832);
        ctx.fillStyle = 'rgba(255,255,255,' + (b.a * 0.8) + ')'; ctx.fill();
      }
    };

    // al salir de esta pestaña el video se pausa; al volver empieza arriba
    const tick = (t) => {
      const visible = root.clientHeight > 0 && root.getClientRects().length > 0;
      if (!visible) { if (!this.wasHidden && yt) pause(); this.wasHidden = true; }
      else {
        if (this.wasHidden) { this.wasHidden = false; root.scrollTop = 0; sTop = 0; size(); }
        if (root.clientWidth !== W || root.clientHeight !== H) size();
        draw(t);
      }
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }

  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    if (this.io) this.io.disconnect();
    window.removeEventListener('resize', this.onResize);
    if (this.root) this.root.removeEventListener('pointerdown', this.onDown);
  }

  renderVals() {
    return { setRoot: this.setRoot };
  }
}

DCBoot(Component, {});
</script>
