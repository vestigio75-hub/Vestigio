  <p class="dek">Cuando alguien desaparece, ¿recuerdas el rostro del desaparecido o de la persona detrás de su búsqueda?</p>

<div class="body">
  <p class="drop fade-up">Seguramente, se recuerda una fotografía. En algunas ocasiones un rostro que se repite en carteles, ropa, redes, etc., un rostro que se vuelve familiar incluso para quienes jamás lo conocieron. Pero detrás de esa fotografía, siempre hay alguien que la sostiene, que la pública, la imprime y la cuenta. Alguien que ha desarrollado, sin darse cuenta, una habilidad para reconocer a su familiar entre miles. A nunca olvidar, después de tanto contar, quién es esa persona, qué llevaba puesto o sus marcas corporales reconocibles. Alguien que sigue hablando de él, a pesar de que mucha gente dude sobre la conjugación verbal para mencionarlos. <span class="hl">Para esa persona que sostiene la foto, la conjugación será en presente hasta que se demuestre lo contrario.</span></p>
</div>

</span> <span class="w">quien</span> <span class="w">escuche,</span> <span class="w">debe</span> <span class="w">convertirse</span> <span class="w">en</span> <span class="w">un</span> <span class="w">rostro.</span></p>

<div class="body">
  <p class="fade-up">Panamá Díaz, fotógrafa, llegó a Colombia desde Málaga, España, mediante una beca de cooperación internacional con el colectivo Orlando Fals. Allí conoció a algunos de esos alguien: mujeres que buscaban a sus familiares desaparecidos. Al principio ella llevaba una cámara con el propósito de fotografiarlas, pero se dio cuenta que una foto podía mostrar sus rostros, pero no necesariamente todo lo que había detrás. Ellas cargaban con otros nombres, con lugares que habían tenido que olvidar o que las obligaron a dejar, con hijos, con hermanos, con vidas que no cabían en la palabra “búsqueda”.</p>
  <p class="fade-up">Las fotografías tomaron una nueva dirección: si las imágenes eran el mejor recurso para encontrar a quienes faltan, ¿por qué no hacer fotografías de quienes seguían ahí? De las mujeres buscadoras que también querían tener un lugar en la memoria de otros. <span class="hl">Ser reconocidas.</span></p>
</div>


<section class="frame-in"><span class="c tl"></span><span class="c tr"></span><span class="c bl"></span><span class="c br"></span>
  <p>Frente a la cámara de Panamá comenzaron a llegar mujeres con distintas historias.</p>
</section>

<div class="body">
  <p class="fade-up">No todas habían llegado a ser buscadoras por el mismo camino. Tampoco todas habían tenido tiempo de detenerse a pensar qué había ocurrido con sus propias vidas mientras intentaban reconstruir las de quienes ya no estaban.</p>
  
  <p class="sent"><span class="s">Una de ellas, a sus ocho años, había visto la sangre de su tío a lo largo del suelo.</span> <span class="s">Lo habían asesinado frente a ella.</span> <span class="s">Después, tuvo que vivir el desplazamiento forzado tras recibir amenazas por tener cierto apellido.</span> <span class="s">Ella no termina de entenderlo, porque nadie le explica a una niña lo que es tener que correr de tu hogar por ser quien eres, ni mucho menos lo que sucede cuando tu hermano desaparece forzosamente y al no saber nada de él, tu madre empieza a comportarse raro, parece estar triste, pero ella no sabe que su madre está deprimida porque es solo una niña, ¿no?, después habrá tiempo de explicárselo.</span></p>
  <p class="fade-up">Efectivamente, después entendió lo que pasaba. Y la vida quiso estar segura de ello cuando al ser mayor su esposo también desapareció. Ya no era una niña. Pero en su vida la violencia no apareció una sola vez, volvió, mutó de forma y la obligó a moverse nuevamente. <span class="hl">Jamás ha parado, su vida jamás quedó detenida.</span> Esta mujer se formó para acompañar a otras mujeres como ella, eligió el camino contrario al estático, porque sabía lo que significaba quedarse en él, y ahora estaba sentada frente a Panamá contando su historia.</p>
  <p class="fade-up">En este punto, se despertarían, no solo en Panamá, sensaciones de tristeza o de dolor. Pero, hay algo más allá de entender lo que genera la continuidad de los hechos, no porque una persona no pueda encontrar una reflexión o enseñanza, sino porque a veces hay que ver que <span class="hl">la vida es tan intensa que insiste en seguir ocurriendo.</span></p>
  <p class="sent"><span class="s">Igualmente, la cámara no se apaga, sigue tomando fotos.</span> <span class="s">Y la persona que la sostiene sigue escuchando, sintiendo, opinando internamente, acompañada de esa sensación en el estómago que es extraña, pero que reconoces en las situaciones en las que aparece.</span> <span class="s">Quizá era impotencia.</span> <span class="s">Quizá una mezcla de tristeza y enojo.</span></p>
</div>


<section class="frame-in"><span class="c tl"></span><span class="c tr"></span><span class="c bl"></span><span class="c br"></span>
  <p>Pero la cámara seguía ahí, y otra mujer acababa de sentarse frente a ella.</p>
</section>

<div class="body">
  <p class="fade-up">No todas las historias tienen como punto de partida la infancia, algunas comienzan tiempo después, cuando una mujer ya ha construido una vida, familia y hasta una rutina, pero llega un día en el que esa rutina deja de seguir un paso a paso, pues algo o alguien empieza a faltar.</p>
  <p class="fade-up">En San José del Guaviare una mujer busca a su hija. Tenía nueve años cuando se la llevaron. Panamá recuerda que cuando la conoció, la mujer llevaba puesta una camiseta con la fotografía de la niña. Su rostro estaba ahí, impreso sobre la tela.</p>
</div>
<section class="quote"><p class="wbw"><span class="w">¿A</span> <span class="w">quién</span> <span class="w">debía</span> <span class="w">mirar?</span></p></section>
<div class="body">
  <p class="fade-up">La foto de la niña no estaba sobre un cartel o una pared, estaba sobre su propio cuerpo, allí se hacía visible. <span class="hl">Las miraba a ambas, reconoció a ambas.</span></p>
</div>
<section class="split" id="timeSplit">
  <div class="stick">
    <div class="verb"><span id="v1">está</span><span id="v2" class="off">estaba</span></div>
    <div class="verb-cap mono muted">Presente · pasado</div>
  </div>
  <div class="flow">
    <p class="fade-up">Es extraño cómo actúa el tiempo cuando alguien desaparece. Para muchos, lo ocurrido hace parte del pasado. Para quienes buscan, no necesariamente. Por eso el tiempo verbal hace dudar: a veces se habla de esa persona en presente y a veces en pasado. No porque se acepte la ausencia, sino porque la incertidumbre ocupa un lugar sin pedir permiso. El tiempo avanza sin preguntarte si estás lista, y hay que acomodar las cosas de alguna forma. La camiseta es eso: una manera de seguir y de decidir qué espacio ocupa la incertidumbre.</p>
    <p class="fade-up">Con el tiempo, Panamá encontró objetos como ese en muchas de las historias: fotos, cartas, velas, camisetas. Cosas que vistas desde afuera parecen ordinarias, pero que para quien las guarda son de las pocas formas que quedan de relacionarse con quien ya no está. Algunas mujeres cuidan una fotografía como lo más valioso que tienen. Otras no tienen ninguna: el desplazamiento, la pobreza o el simple paso del tiempo hicieron que se perdieran, o que nunca existieran.</p>
  </div>
</section>


<section class="reveal-wrap" id="darkStart">
  <div class="reveal-sticky">
    <p class="reveal-text" data-vanish="donde debería estar la cara."><span class="w">Es</span> <span class="w">en</span> <span class="w">esos</span> <span class="w">casos</span> <span class="w">cuando</span> <span class="w">la</span> <span class="w">descripción</span> <span class="w">tiene</span> <span class="w">que</span> <span class="w">hacer</span> <span class="w">el</span> <span class="w">trabajo</span> <span class="w">de</span> <span class="w">la</span> <span class="w">foto.</span> <span class="w">Algunas</span> <span class="w">buscan</span> <span class="w">con</span> <span class="w">una</span> <span class="w">plantilla:</span> <span class="w">unos</span> <span class="w">hombros,</span> <span class="w">una</span> <span class="w">cabeza</span> <span class="w">y</span> <span class="w">un</span> <span class="w">espacio</span> <span class="w">vacío</span> <span class="w vanish">donde</span> <span class="w vanish">debería</span> <span class="w vanish">estar</span> <span class="w vanish">la</span> <span class="w vanish">cara.</span></p>
  </div>
</section>

<div class="body">
  <p class="fade-up">Por eso también hace falta alguien que escuche. Aunque escuchar no siempre significa encontrar una respuesta, porque hay búsquedas que se extienden tanto que terminan ocupando espacios que pertenecían a otras personas.</p>
</div>


<section class="frame-in"><span class="c tl"></span><span class="c tr"></span><span class="c bl"></span><span class="c br"></span>
  <p>Otra mujer se sienta frente a la cámara.</p>
</section>

<div class="body">
  <p class="sent"><span class="s">Panamá recuerda, especialmente, la sensación de culpa que acompañaba lo que contaba la mujer, la forma en la que describía cómo, después de la desaparición de uno de sus hijos, el otro comenzó a consumir marihuana.</span> <span class="s">Y cada vez sentía más que a él también lo estaba perdiendo.</span> <span class="s">Se juzgaba por no haber estado pendiente, no haber visto lo que ocurría mientras su atención estaba puesta en encontrar a su otro hijo.</span> <span class="s"><span class="hl">Sentía que, en su búsqueda, seguía perdiendo.</span></span></p>
  <p class="fade-up">Panamá pensó en que hay algo injusto en la responsabilidad que parece recaer sobre las mujeres. No solo es buscar, preguntar, contar una y otra vez una historia y recorrer lugares con esperanza. También, tienen que preguntarse si están haciendo lo suficiente, y no solo por la persona desaparecida, sino por ellas y por los demás. <span class="hl">Quizá no habría que preguntarles a estas mujeres qué han hecho por sus familias, sino qué no han hecho.</span> Porque, aun después de todo, probablemente sentirían que pudieron hacer algo más.</p>
</div>
<section class="quote"><p class="wbw"><span class="w">Nuevamente,</span> <span class="w">qué</span> <span class="w">injusto.</span></p></section>


<section class="frame-in" id="warmStart"><span class="c tl"></span><span class="c tr"></span><span class="c bl"></span><span class="c br"></span>
  <p>Pero, ni las mujeres que fotografiaba Panamá ni sus historias terminaban ahí.</p>
</section>

<div class="body">
  <p class="fade-up">Ella había llegado a conocerlas a través de sus búsquedas, pero con el tiempo reconoció los otros espacios en los que también estaban presentes. Lugares en los que no tenían que repetir su historia mil veces esperando que a alguien le importara, y donde podían dejar de hablar de quienes faltaban sin sentir que por eso los abandonaban.</p>
</div>
<section class="split" id="placesSplit">
  <div class="stick places">
    <div><small>Villavicencio</small>La escuela</div>
    <div><small>San José del Guaviare</small>Las orquídeas</div>
    <div><small>Tumaco</small>Las cantoras</div>
  </div>
  <div class="flow">
    <div class="block" data-block><div class="place-h mono">Villavicencio</div>
      <p class="fade-up">En Villavicencio, algunas mujeres habían creado una escuela de alfabetización. Aprender a leer y escribir era mucho más que reconocer letras o formar palabras. Era poder leer aquello que durante tanto tiempo otras personas habían tenido que explicarles, escribir o firmar una denuncia por sí mismas. Tener la posibilidad de hacer con sus propias manos algo que antes dependía de alguien más.</p></div>
    <div class="block" data-block><div class="place-h mono">San José del Guaviare</div>
      <p class="fade-up">Panamá conoció también lo que había nacido de estas mujeres. En San José del Guaviare, algunas recogían orquídeas que encontraban maltratadas a un lado de la carretera. Se las llevaban, las cuidaban y después las volvían a sembrar. Pero esto no se trataba solo de flores. Era un tiempo compartido que no tenía que girar alrededor de lo que habían vivido, era un espacio para encontrarse, ocuparse de algo distinto y, quizá, descansar un momento.</p></div>
    <div class="block" data-block><div class="place-h mono">Tumaco</div>
      <p class="fade-up">En Tumaco, un territorio golpeado por el abandono y el racismo, están las cantoras de Esperanza y Paz. Panamá recuerda a una de ellas, que había vivido búsquedas muy duras y violencias desde niña, y que aun así decidió unirse al grupo. Allí, el canto se volvió una forma de sanar en colectivo. No olvidan lo que pasó, claro, pero lo enfrentan juntas.</p></div>
  </div>
</section>

<div class="body">
  <p class="sent"><span class="s">Lo más llamativo, si es que se le puede denominar de esa forma, es que estos encuentros no borraban lo que había ocurrido.</span> <span class="s">Las mujeres no dejaban de ser buscadoras por asistir a una escuela, recoger orquídeas o cantar.</span> <span class="s">Pero, tampoco tenían que dejar de lado sus historias para encontrar esos espacios.</span></p>
</div>
<section class="quote"><p class="wbw"><span class="w">Panamá</span> <span class="w">descubrió</span> <span class="w">que</span> <span class="w">el</span> <span class="w">dolor</span> <span class="w">tenía</span> <span class="w">voz.</span></p></section>
<div class="body">
  <p class="fade-up">Y no una voz que pesaba y gritaba por ayuda. Sino una que sabía qué era lo que quería y debía hacer.</p>
  
  <p class="fade-up">Al comienzo preguntaba qué rostro se recuerda cuando alguien desaparece. Quizá no haya una respuesta correcta. Está el rostro de quien falta, el que se repite en fotografías para poder encontrarlo. Pero también está el de quienes buscan, el de quien pasa años esperando reconocer y ser reconocida, mientras intenta seguir con una aparente normalidad. Se suele esperar ver el dolor en estas historias, por morbo o por una forma de buscar sentir empatía, pero ellas no quieren que les tengan lástima. No quieren que su vida se reduzca a esperar. <span class="hl">Nadie puede decirte cómo vivir el dolor, y mucho menos enseñarte a hacerlo mientras eres tú quien lo vive.</span></p>
  <p class="fade-up">Con las mujeres buscadoras vemos y entendemos que recordar una desaparición también debería significar recordar a quienes siguen aquí. No solo por lo que hacen o a quién buscan, sino por lo que, empujadas por la fuerza de una ausencia, han sido y logrado ser.</p>
</div>
