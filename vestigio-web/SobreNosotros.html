<script>

class Component extends DCLogic {
  setScroller = (el) => { this.scroller = el; };
  setStage = (el) => { this.stage = el; };
  setLight = (el) => { this.light = el; };
  setTitle = (el) => { this.title = el; };
  setSub = (el) => { this.sub = el; };
  setHint = (el) => { this.hint = el; };
  setRow1 = (el) => { this.row1 = el; };
  setRow2 = (el) => { this.row2 = el; };
  photos = [null, null, null, null, null];
  bars = [null, null, null, null, null];
  setPhoto0 = (el) => { this.photos[0] = el; };
  setBar0 = (el) => { this.bars[0] = el; };
  reveal0 = () => { if (!this.isTouch()) this.reveal(0); };
  setPhoto1 = (el) => { this.photos[1] = el; };
  setBar1 = (el) => { this.bars[1] = el; };
  reveal1 = () => { if (!this.isTouch()) this.reveal(1); };
  setPhoto2 = (el) => { this.photos[2] = el; };
  setBar2 = (el) => { this.bars[2] = el; };
  reveal2 = () => { if (!this.isTouch()) this.reveal(2); };
  setPhoto3 = (el) => { this.photos[3] = el; };
  setBar3 = (el) => { this.bars[3] = el; };
  reveal3 = () => { if (!this.isTouch()) this.reveal(3); };
  setPhoto4 = (el) => { this.photos[4] = el; };
  setBar4 = (el) => { this.bars[4] = el; };
  reveal4 = () => { if (!this.isTouch()) this.reveal(4); };

  copy0 = (e) => this.copyMail(e, 'samuelsuarezrueda01@gmail.com');
  copy1 = (e) => this.copyMail(e, 'valentina.casascc@gmail.com');
  copy2 = (e) => this.copyMail(e, 'gabiserranorodriguez@gmail.com');
  copy3 = (e) => this.copyMail(e, 'gabrielagarcialiceo@gmail.com');
  copy4 = (e) => this.copyMail(e, 'valen.mc221@gmail.com');
  // copia el correo y muestra "Correo copiado"
  copyMail(e, mail) {
    if (e && e.stopPropagation) e.stopPropagation();
    const done = () => {
      this.setState({ toast: true });
      clearTimeout(this.toastT);
      this.toastT = setTimeout(() => this.setState({ toast: false }), 1800);
    };
    const fallback = () => {
      try {
        const ta = document.createElement('textarea');
        ta.value = mail; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
      } catch (err) {}
      done();
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(mail).then(done, fallback);
      else fallback();
    } catch (err) { fallback(); }
  }

  // en celular la foto no se revela con un toque: hay que dejar la luz (el dedo) encima 2 segundos
  isTouch() { return this.lastTouch && performance.now() - this.lastTouch < 1500; }

  reveal(i) {
    const r = (this.state && this.state.rev) || [false, false, false, false, false];
    if (r[i]) return;
    const n = r.slice(); n[i] = true;
    this.setState({ rev: n });
  }

  // la luz roja sigue al mouse
  onMove = (e) => {
    this.mx = e.clientX; this.my = e.clientY;
    this.paintLight();
  };
  paintLight() {
    if (!this.light || !this.stage || this.mx == null) return;
    const b = this.stage.getBoundingClientRect();
    const rad = Math.round(Math.min(330, Math.max(150, (this.stage.clientWidth || 1200) * 0.42)));
    this.light.style.background = 'radial-gradient(circle ' + rad + 'px at ' + (this.mx - b.left).toFixed(0) + 'px ' + (this.my - b.top).toFixed(0) + 'px, rgba(0,0,0,0) 0%, rgba(0,0,0,0.25) 50%, rgba(3,0,0,0.9) 100%)';
  }

  componentDidMount() {
    // linterna también con el dedo (celular / tableta)
    this.onTouch = (e) => {
      const t = e.touches && e.touches[0];
      if (!t) return;
      this.lastTouch = performance.now();
      this.mx = t.clientX; this.my = t.clientY;
      this.paintLight();
    };
    this.onTouchEnd = () => { this.lastTouch = performance.now(); };
    if (this.stage) {
      this.stage.addEventListener('touchstart', this.onTouch, { passive: true });
      this.stage.addEventListener('touchmove', this.onTouch, { passive: true });
      this.stage.addEventListener('touchend', this.onTouchEnd, { passive: true });
    }
    // al entrar a la sección todo empieza de cero (también en Windows)
    this.reset = () => {
      if (this.scroller) this.scroller.scrollTop = 0;
      this.su = 0; this.lastU = null; this.hold = [0, 0, 0, 0, 0]; this.mx = null; this.pmax = 0; this.introStart = performance.now();
      if (this.light) this.light.style.background = 'radial-gradient(circle 330px at 50% 45%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.25) 50%, rgba(3,0,0,0.9) 100%)';
      this.setState({ rev: [false, false, false, false, false] });
    };
    try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) {}
    this.forceTopUntil = performance.now() + 1000;
    this.reset();
    this.onVis = () => { this.reset(); this.forceTopUntil = performance.now() + 600; };
    document.addEventListener('visibilitychange', this.onVis);
    window.addEventListener('pageshow', this.reset);
    if (window.IntersectionObserver && this.scroller) {
      this.io = new IntersectionObserver((entries) => { entries.forEach((e) => { if (!e.isIntersecting) this.reset(); }); });
      this.io.observe(this.scroller);
    }
    let last = performance.now();
    const clamp = (v) => Math.min(1, Math.max(0, v));
    const ease = (t) => 0.5 - 0.5 * Math.cos(Math.PI * t);
    const tick = (now) => {
      const dt = Math.min(100, now - last); last = now;
      const el = this.scroller;
      if (el) {
        const visible = el.clientHeight > 0 && el.getClientRects().length > 0;
        if (!visible) this.wasHidden = true;
        else if (this.wasHidden) { this.wasHidden = false; this.reset(); this.forceTopUntil = performance.now() + 600; }
        if (performance.now() < this.forceTopUntil && el.scrollTop !== 0) { el.scrollTop = 0; this.su = 0; }
        const vh = el.clientHeight || 900;
        const target = el.scrollTop;
        this.su = this.su == null ? target : this.su + (target - this.su) * 0.12;
        if (Math.abs(target - this.su) < 0.2) this.su = target;
        {
          this.lastU = this.su;
          // lo que ya apareció no se esconde al volver a subir
          this.pmax = Math.max(this.pmax || 0, clamp(this.su / (1.1 * vh)));
          const p = this.pmax;
          // 1) el título aparece solo, con animación, apenas se entra
          const t = ease(clamp((performance.now() - (this.introStart || 0) - 300) / 1400));
          if (this.title) {
            this.title.style.opacity = t.toFixed(3);
            this.title.style.transform = 'translateY(' + (40 * (1 - t)).toFixed(1) + 'px) scale(' + (0.85 + 0.15 * t).toFixed(3) + ')';
            this.title.style.letterSpacing = (0.3 * (1 - t)).toFixed(3) + 'em';
          }
          if (this.sub) this.sub.style.opacity = ease(clamp((performance.now() - (this.introStart || 0) - 1300) / 800)).toFixed(3);
          // 2) al deslizar bajan las fotos de arriba y luego las de abajo
          const r1 = ease(clamp((p - 0.03) / 0.35)), r2 = ease(clamp((p - 0.35) / 0.35));
          if (this.row1) { this.row1.style.opacity = r1.toFixed(3); this.row1.style.top = (-60 * (1 - r1)).toFixed(1) + 'px'; }
          if (this.row2) { this.row2.style.opacity = r2.toFixed(3); this.row2.style.top = (-60 * (1 - r2)).toFixed(1) + 'px'; }
          if (this.hint) this.hint.style.opacity = (1 - clamp((p - 0.6) / 0.15)).toFixed(3);
          this.ready = p > 0.72;
          this.paintLight();
        }
      }
      // alumbrar una foto 2 segundos la revela
      const rev = (this.state && this.state.rev) || [];
      this.photos.forEach((ph, i) => {
        if (!ph || rev[i]) return;
        const r = ph.getBoundingClientRect();
        const inside = this.ready && this.mx != null && this.mx > r.left && this.mx < r.right && this.my > r.top && this.my < r.bottom;
        this.hold[i] = inside ? this.hold[i] + dt : Math.max(0, this.hold[i] - dt * 2);
        if (this.bars[i]) this.bars[i].style.width = Math.min(100, this.hold[i] / 20).toFixed(1) + '%';
        if (this.hold[i] >= 2000) this.reveal(i);
      });
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }

  componentWillUnmount() {
    if (this.stage) {

      this.stage.removeEventListener('touchend', this.onTouchEnd);
    }

    window.removeEventListener('pageshow', this.reset);
    if (this.io) this.io.disconnect();
    cancelAnimationFrame(this.raf);
  }

  renderVals() {
    const rev = (this.state && this.state.rev) || [];
    const c = (i) => ({ z: rev[i] ? 55 : 1, ph: rev[i] ? 1 : 0, nm: rev[i] ? 0 : 1, mh: rev[i] ? 80 : 0 });
    const st = this.state || {};
    return {
      toastText: 'Correo copiado', toastOp: st.toast ? 1 : 0, toastY: st.toast ? 0 : 10,
      copy0: this.copy0,
      copy1: this.copy1,
      copy2: this.copy2,
      copy3: this.copy3,
      copy4: this.copy4,

      setPhoto2: this.setPhoto2, setBar2: this.setBar2, reveal2: this.reveal2, c2: c(2),
      setPhoto3: this.setPhoto3, setBar3: this.setBar3, reveal3: this.reveal3, c3: c(3),
      setPhoto4: this.setPhoto4, setBar4: this.setBar4, reveal4: this.reveal4, c4: c(4),
    };
  }
}

</script>
